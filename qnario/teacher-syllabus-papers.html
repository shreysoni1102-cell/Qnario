<!DOCTYPE html>
<html lang="en">
<head>
    <title>Qnario – Syllabus Generated Papers</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:600,700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; min-height: 100vh; background: linear-gradient(-45deg, #0f0c29, #1a1a3a, #24243e, #302b63); background-size: 400% 400%; animation: gradientBG 15s ease infinite; color: white; padding: 40px 20px; }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .container { max-width: 1100px; margin: auto; background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); border-radius: 20px; padding: 40px; box-shadow: 0 0 40px rgba(16, 185, 129, 0.25); }
        h2 { text-align: center; font-size: 2rem; margin-bottom: 30px; background: linear-gradient(90deg, #10b981, #34d399); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .filter-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; }
        table { width: 100%; border-collapse: collapse; overflow: hidden; border-radius: 14px; background: rgba(255,255,255,0.04); }
        th, td { padding: 14px 12px; text-align: left; font-size: 0.9rem; }
        th { background: rgba(255,255,255,0.08); font-weight: 700; }
        tr { border-bottom: 1px solid rgba(255,255,255,0.08); }
        tr:last-child { border-bottom: none; }
        td.actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn { padding: 8px 14px; border-radius: 10px; border: none; cursor: pointer; font-weight: 600; font-size: 0.8rem; color: white; transition: 0.3s ease; }
        .btn-preview { background: linear-gradient(135deg, #667eea, #4facfe); box-shadow: 0 0 15px rgba(79,172,254,0.4); }
        .btn-preview:hover { box-shadow: 0 0 25px rgba(79,172,254,0.6); transform: translateY(-2px); }
        .btn-download { background: linear-gradient(135deg, #f59e0b, #d97706); box-shadow: 0 0 15px rgba(245,158,11,0.4); }
        .btn-download:hover { box-shadow: 0 0 25px rgba(245,158,11,0.6); transform: translateY(-2px); }
        .btn-host { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 0 15px rgba(16,185,129,0.4); }
        .btn-host:hover { box-shadow: 0 0 25px rgba(16,185,129,0.6); transform: translateY(-2px); }
        td:first-child { background: rgba(16, 185, 129, 0.1); font-weight: 600; color: #34d399; }
        th:first-child { background: rgba(16, 185, 129, 0.2); }
        .empty-state { text-align: center; padding: 60px 20px; font-size: 1.1rem; opacity: 0.9; }
        .empty-state a { color: #34d399; font-weight: 600; text-decoration: none; }
        .empty-state a:hover { text-decoration: underline; }

        /* Modal Styles */
        .modal { display: none; position: fixed; z-index: 1000; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: #1e1e2f; padding: 30px; border-radius: 16px; max-width: 800px; width: 100%; max-height: 90vh; overflow-y: auto; position: relative; }
        .close-modal { position: absolute; right: 20px; top: 20px; cursor: pointer; font-size: 1.5rem; color: #ef4444; }

        @media (max-width: 900px) {
            .container { padding: 20px; } table, thead, tbody, th, td, tr { display: block; } th { display: none; }
            tr { margin-bottom: 20px; padding: 14px; background: rgba(255,255,255,0.05); border-radius: 12px; } td { border: none; padding: 6px 0; } td.actions { margin-top: 10px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Syllabus-Based Exams</h2>

    <div class="filter-bar">
        <a href="teacher-papers.html" style="padding: 10px 20px; background: rgba(255,255,255,0.1); color: white; border-radius: 10px; text-decoration: none; font-weight: 600;">⬅️ Back</a>
        <a href="teacher-syllabus-upload.html" style="padding: 10px 20px; background: linear-gradient(135deg, #10b981, #059669); color: white; border-radius: 10px; text-decoration: none; font-weight: 600;">📄 Scan New Syllabus</a>
    </div>

    <div id="tableContainer">
        <div class="empty-state">Loading papers...</div>
    </div>
</div>

<div class="modal" id="previewModal">
    <div class="modal-content">
        <span class="close-modal" id="closePreviewModal">&times;</span>
        <h3 style="margin-bottom: 20px; color: #34d399;">Exam Paper Preview</h3>
        <div id="previewContent" style="line-height: 1.8; color: #f1f5f9;"></div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", loadPapers);

    async function loadPapers() {
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        const emailToFetch = currentUser ? currentUser.email : '';

        try {
            const res = await fetch(`/api/syllabus-papers?teacherEmail=${emailToFetch}`);
            const data = await res.json();
            
            if (!data.success || data.papers.length === 0) {
                document.getElementById('tableContainer').innerHTML = `
                    <div class="empty-state">
                        You have not generated any exams from a syllabus yet. <br><br>
                        <a href="teacher-syllabus-upload.html">Upload a Syllabus to Start</a>
                    </div>
                `;
                return;
            }

            renderTable(data.papers);
        } catch (e) {
            document.getElementById('tableContainer').innerHTML = '<div class="empty-state" style="color:#fca5a5;">Failed to load papers right now.</div>';
        }
    }

    function renderTable(papers) {
        let html = `
            <table>
                <thead>
                    <tr>
                        <th>Date & Time</th>
                        <th>Subject</th>
                        <th>Class</th>
                        <th>Marks</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
        `;

        papers.reverse().forEach(p => {
            const d = new Date(p.createdAt);
            const dateStr = d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

            html += `
                <tr>
                    <td>${dateStr}</td>
                    <td>${p.subject}</td>
                    <td>${p.className}</td>
                    <td>${p.totalMarks} Marks</td>
                    <td class="actions">
                        <button class="btn btn-preview" onclick="previewPaper('${p.id}')">👁️ Preview</button>
                        <button class="btn btn-download" onclick="downloadPdf('${p.id}')">📥 Download PDF</button>
                        <button class="btn btn-host" onclick="hostLiveExam('${p.id}')">📺 Host Live</button>
                    </td>
                </tr>
            `;
        });

        html += `</tbody></table>`;
        document.getElementById('tableContainer').innerHTML = html;
    }

    // Modal Logic
    const modal = document.getElementById('previewModal');
    const previewContent = document.getElementById('previewContent');
    document.getElementById('closePreviewModal').onclick = () => modal.style.display = "none";
    window.onclick = (e) => { if(e.target == modal) modal.style.display = "none"; }

    async function previewPaper(id) {
        previewContent.innerHTML = '<i>Fetching paper details...</i>';
        modal.style.display = "flex";

        try {
            const res = await fetch(`/api/syllabus-papers/${id}`);
            const data = await res.json();
            if (!data.success) { previewContent.innerHTML = 'Error loading paper details.'; return; }

            const p = data.paper;
            let html = `
                <div style="margin-bottom: 20px; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 8px;">
                    <strong>Subject:</strong> ${p.subject} | <strong>Class:</strong> ${p.className} | <strong>Total Marks:</strong> ${p.totalMarks} <br>
                    <strong>ID:</strong> ${p.id}
                </div>
            `;

            if (p.questions && p.questions.length > 0) {
                p.questions.forEach((q, idx) => {
                    html += `
                        <div style="margin-bottom: 16px; padding: 12px; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; background: rgba(255,255,255,0.03);">
                            <strong>Q${idx+1} [${q.marks} Marks]:</strong> ${q.text} <br>
                            <span style="color:#a78bfa; font-size: 0.85rem;">Topic: ${q.topic}</span>
                        </div>
                    `;
                });
            } else {
                html += '<div>No questions found in this paper.</div>';
            }

            previewContent.innerHTML = html;
        } catch (e) {
            previewContent.innerHTML = '<span style="color:#fca5a5;">Failed to fetch paper details.</span>';
        }
    }

    async function downloadPdf(id) {
        alert("Downloading PDF... Please wait.");
        try {
            const res = await fetch(`/api/syllabus-papers/${id}`);
            const data = await res.json();
            if (!data.success) throw new Error("Paper not found");

            const p = data.paper;
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.setFontSize(18);
            doc.text(`${p.subject} Exam Paper`, 105, 15, { align: 'center' });
            
            doc.setFontSize(11);
            doc.text(`Class: ${p.className}`, 15, 25);
            doc.text(`Total Marks: ${p.totalMarks}`, 150, 25);
            doc.line(15, 28, 195, 28); // Header underline

            let yPos = 35;
            doc.setFontSize(12);

            p.questions.forEach((q, idx) => {
                const questionText = `Q${idx+1}. ${q.text} (${q.marks} Marks)`;
                const lines = doc.splitTextToSize(questionText, 180);
                
                if(yPos + (lines.length * 6) > 280) {
                    doc.addPage();
                    yPos = 20;
                }
                
                doc.text(lines, 15, yPos);
                yPos += (lines.length * 7) + 5;
            });

            doc.save(`Syllabus_Paper_${p.subject.replace(/\s+/g,'_')}.pdf`);

        } catch (e) {
            alert("Error generating PDF.");
        }
    }

    function hostLiveExam(id) {
        window.location.href = `teacher-syllabus-monitor.html?paperId=${id}`;
    }
</script>
</body>
</html>
