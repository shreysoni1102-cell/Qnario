<!DOCTYPE html>
<html lang="en">
<head>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:#0f172a;
    color:white;
    min-height:100vh;
    overflow-x:hidden;
}

/* ===== BACKGROUND SYSTEM ===== */

.bg-wrapper{
    position:fixed;
    inset:0;
    z-index:-2;
    overflow:hidden;
}

.gradient-mesh{
    position:absolute;
    width:140%;
    height:140%;
    background:
        radial-gradient(circle at 20% 30%, #667eea55, transparent 40%),
        radial-gradient(circle at 80% 70%, #4facfe55, transparent 40%),
        radial-gradient(circle at 50% 50%, #764ba255, transparent 40%);
    filter:blur(120px);
    animation:meshMove 20s ease-in-out infinite alternate;
}

@keyframes meshMove{
    0%{transform:translate(0,0) scale(1);}
    100%{transform:translate(-5%,5%) scale(1.1);}
}

.grid-overlay{
    position:absolute;
    inset:0;
    background-image:linear-gradient(rgba(255,255,255,0.05) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,0.05) 1px,transparent 1px);
    background-size:60px 60px;
}

/* ===== NAVBAR ===== */

.navbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 60px;
}

.logo{
    font-family:'Space Grotesk',sans-serif;
    font-size:1.6rem;
    font-weight:700;
    background:linear-gradient(135deg,#667eea,#4facfe);
    background-clip:text;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    text-decoration:none;
}

/* ===== LAYOUT ===== */

.container{
    max-width:1000px;
    margin:40px auto;
    padding:0 20px;
}

/* ===== GLASS CARD ===== */

.card{
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(25px);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:20px;
    padding:35px;
    box-shadow:0 20px 60px rgba(0,0,0,0.4);
}

/* ===== HEADER ===== */

.header{
    text-align:center;
    margin-bottom:30px;
}

.header h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:2.5rem;
    margin-bottom:10px;
}

.header p{
    opacity:0.7;
}

/* ===== FORM ===== */

.form-group{
    margin-bottom:20px;
}

.form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:500;
    font-size:0.9rem;
    opacity:0.8;
}

input,select{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.1);
.brand-header{
    text-align:center;
    /* remove extra spacing so the logo and role selector sit closer */
    margin-bottom:0;
}.brand-header{
    text-align:center;
    /* remove extra spacing so the logo and role selector sit closer */
    margin-bottom:0;
}    /* give selects a colorful gradient to match the theme */
    background:rgba(255,255,255,0.05);
    color:white;
    font-size:0.95rem;
}

/* put a bright gradient on dropdowns and remove the plain border */
select{
    background:linear-gradient(135deg,#667eea,#4facfe);
    border:none;
}

/* ensure options are readable when the menu opens */
select option{
    background:#0f172a;
    color:white;
}

input:focus,select:focus{
    outline:none;
    border-color:#667eea;
}

/* ===== BUTTON ===== */

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,#667eea,#4facfe);
    color:white;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 30px rgba(102,126,234,0.5);
}

button:disabled{
    opacity:0.6;
    cursor:not-allowed;
}

/* ===== INFO / ALERT ===== */

.info-box,
.alert,
.stats{
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:14px;
    padding:15px;
    margin-bottom:20px;
}

.alert.error{
    border-color:#ff4d4d;
}

.alert.success{
    border-color:#22c55e;
}

.loading{
    display:none;
    margin:20px 0;
}

.spinner{
    display:inline-block;
    width:18px;
    height:18px;
    border:3px solid rgba(255,255,255,0.3);
    border-top:3px solid #667eea;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin-right:10px;
}

@keyframes spin{
    100%{transform:rotate(360deg);}
}

/* ===== QUESTIONS ===== */

.questions-container{
    margin-top:40px;
}

.question-card{
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);

    padding:20px;
    margin-bottom:15px;

.question-number{
    font-weight:600;
    color:#667eea;
    margin-bottom:6px;
}

.question-meta{
    display:flex;
    gap:15px;
    margin-top:10px;
    font-size:0.85rem;
    opacity:0.7;
}

@media(max-width:768px){
    .form-row{
        grid-template-columns:1fr;
    }
}
</style>
</head>

    const form = document.getElementById('questionForm');
    const loading = document.getElementById('loading');

    const levelSelect = document.getElementById('level');

    function showAlert(message, type) {
        alert.textContent = message;
        alert.className = `alert ${type}`;
        alert.style.display = 'block';
        setTimeout(() => {
            alert.style.display = 'none';
        }, 5000);
    }

    function populateSelect(select, options) {
        select.innerHTML = '<option value="">Select...</option>';
        options.forEach(option => {
            const opt = document.createElement('option');
            opt.value = option;
            opt.textContent = option;
            select.appendChild(opt);
        });
    }

    function updateSubjectOptions() {
        const level = levelSelect.value;
        const stream = streamSelect.value;
        subjectSelect.innerHTML = '<option value="">Select subject...</option>';

        if (level === '11th' || level === '12th') {
            populateSelect(subjectSelect, SUBJECTS_11_12);
        } else if (level === 'UG' && (stream === 'Information Technology' || stream === 'Computer Science Engineering (CSE)')) {
            populateSelect(subjectSelect, SUBJECTS_UG_CSE_IT);
        }
        // For PG, handled separately
    }

    function updateChapterOptions() {
        const level = levelSelect.value;
        const subject = subjectSelect.value;
        chapterSelect.innerHTML = '<option value="">Select chapter...</option>';

        if ((level === '11th' || level === '12th') && CHAPTERS[level] && CHAPTERS[level][subject]) {
            populateSelect(chapterSelect, CHAPTERS[level][subject]);
        }
    }

    function updateQuestionTypeOptions() {
        const marks = marksSelect.value;
        const options = ['Multiple Choice Question (MCQ)', 'Multiple Select Question (MSQ)', 'One-word Answer', 'True/False', 'Short Answer'];
        if (marks === '1M' || marks === '2M') {
            options.push("Objective's");
        }
        populateSelect(questionTypeSelect, options);
    }

    // Event listeners
    levelSelect.addEventListener('change', () => {
        const level = levelSelect.value;
        if (level === 'UG') {
            streamSelect.disabled = false;
            streamSelect.required = true;
        } else {
            streamSelect.disabled = true;
            streamSelect.required = false;
            streamSelect.value = '';
        }
        if (level === 'PG') {
            confirm('We are working on it');
            levelSelect.value = '';
            return;
        }
        updateSubjectOptions();
        updateChapterOptions();
    });

    streamSelect.addEventListener('change', () => {
        updateSubjectOptions();
        updateChapterOptions();
    });

    subjectSelect.addEventListener('change', updateChapterOptions);

    marksSelect.addEventListener('change', updateQuestionTypeOptions);

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const level = document.getElementById('level').value;
        const stream = document.getElementById('stream').value;
        const subject = document.getElementById('subject').value;
        const numQuestions = parseInt(document.getElementById('numQuestions').value);
        const chapter = document.getElementById('chapter').value;
        const marks = document.getElementById('marks').value;
        const questionType = document.getElementById('questionType').value;
        const specificTopics = document.getElementById('specificTopics').value;

        if (!level || !subject || !numQuestions || !chapter || !marks || !questionType) {
            showAlert('❌ Please fill all required fields', 'error');
            return;
        }

        if (level === 'UG' && !stream) {
            showAlert('❌ Please select a stream for UG', 'error');
            return;
        }

        if (numQuestions < 1 || numQuestions > 20) {
            showAlert('❌ Questions must be between 1 and 20', 'error');
            return;
        }

        // Validate question type based on marks
        if (questionType === "Multiple Choice Question (MCQ)" && !(marks === '1M' || marks === '2M')) {
            if (!confirm('MCQ should be 1M or 2M. Continue?')) {

            }
        }

            if (!confirm('For short answer minimum should be 2M. Continue?')) {
                return;
            }
        }

        if (questionType === 'Long Answer' && (marks === '1M' || marks === '2M')) {

                return;
            }

        const subjectId = SUBJECT_IDS[subject] || null;

        alert.style.display = 'none';

        stats.style.display = 'none';

        try {
            console.log('📤 Sending request to server...');
            console.log({ level, stream, subject, numQuestions, chapter, marks, questionType, subjectId, examId: EXAM_ID });

            const response = await fetch('/api/generate-questions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    level,
                    stream,
                    subject,
                    topic: chapter,
                    numQuestions,
                    chapter,
                    marks,
                    questionType,
                    specificTopics,
                    subjectId,
                    examId: EXAM_ID,
                    subjectName: subject
                })
            });

            console.log('📥 Response status:', response.status);
            const data = await response.json();
            console.log('📥 Full Response data:', JSON.stringify(data, null, 2));
            
            // Debug: Check options format
            if (data.questions && data.questions.length > 0) {
                console.log('🔍 First question options:', data.questions[0].options);
                console.log('🔍 Option type:', typeof data.questions[0].options);
                if (data.questions[0].options && data.questions[0].options.length > 0) {
                    console.log('🔍 First option:', JSON.stringify(data.questions[0].options[0]));
                }
            }

            if (!response.ok) {
                throw new Error(data.details || data.error || 'Failed to generate questions');
            }

            // Show success
            loading.style.display = 'none';
            stats.style.display = 'block';
            statsCount.textContent = data.questionsCount || data.questions.length;
            statsStatus.textContent = '✅ Questions generated and ready!';
            showAlert(`✅ Generated ${data.questionsCount || data.questions.length} questions for "${subject}" - "${chapter}"`, 'success');

            // Save questions to localStorage for teacher-papers.html
            saveGeneratedQuestions(data.questions, subject, chapter, level, stream, marks, questionType, specificTopics);

            // Display questions
            try {
                displayQuestions(data.questions, subject, chapter, level, stream, marks, questionType, specificTopics);
            } catch (displayError) {
                console.error('❌ Error displaying questions:', displayError);
                console.error('Error stack:', displayError.stack);
                throw displayError;
            }

        } catch (error) {
            console.error('❌ Error:', error);
            loading.style.display = 'none';
            stats.style.display = 'block';
            statsStatus.textContent = '❌ Generation Failed';
            showAlert(`❌ Error: ${error.message}`, 'error');
        } finally {
            generateBtn.disabled = false;
        }

    function formatOption(opt) {
        if (!opt) return '';
        if (typeof opt === 'string') return opt.trim();
        if (typeof opt === 'object') {
            if (opt.text) return String(opt.text).trim();
            if (opt.value) return String(opt.value).trim();
            if (opt.id) return String(opt.id).trim();
            return JSON.stringify(opt).trim();
        }
        return String(opt).trim();
    }

    function cleanOneWordAnswer(raw) {
        if (raw === undefined || raw === null) return 'N/A';
        return String(raw).trim().replace(/^[A-Da-d][\)\.][\s]*/g, '').trim();
    }

    function formatTrueFalseAnswer(q) {
        if (Array.isArray(q.correctAnswers) && q.correctAnswers.length > 0) {
            return q.correctAnswers.map((val, idx) => `${String.fromCharCode(97 + idx)}) ${String(val).trim()}`).join(', ');
        }
        if (q.correctAnswer) {
            const ans = String(q.correctAnswer).trim();
            const parts = ans.split(/[\r\n]+/).map(line => line.trim()).filter(Boolean);
            if (parts.length >= 4) {
                return parts.map((line, idx) => `${String.fromCharCode(97 + idx)}) ${line.replace(/^[A-Da-d][\)\.][\s]*/g, '').trim()}`).join(', ');
            }
            return ans.replace(/^[A-Da-d][\)\.][\s]*/g, '').trim();
        }
        return 'N/A';
    }

    function getResolvedAnswer(q, questionType) {
        if (!q) return 'N/A';

        const resolveVal = (value) => {
            if (value === null || value === undefined) return null;
            if (typeof value === 'string') return value.trim() || null;
            if (Array.isArray(value)) return value.length > 0 ? value : null;
            if (typeof value === 'object') return Object.keys(value).length > 0 ? value : null;
            return String(value).trim() || null;
        };

        const fromQ = (keys) => {
            for (const k of keys) {
                const resolved = resolveVal(q[k]);
                if (resolved !== null && resolved !== undefined && String(resolved).trim() !== '') {
                    return String(resolved).trim();
                }
            }
            return null;
        };

        if (questionType === 'Multiple Choice Question (MCQ)') {
            const subType = q.subType || 'Single Correct MCQ';
            if (subType === 'Single Correct MCQ') {
                const raw = fromQ(['correctAnswer', 'answer', 'option', 'correct']);
                if (!raw) return 'N/A';

                if (q.options && Array.isArray(q.options)) {
                    const normalized = raw.trim();
                    if (/^[A-Za-z]$/.test(normalized)) {
                        const idx = normalized.toUpperCase().charCodeAt(0) - 65;
                        if (q.options[idx]) return `${normalized.toUpperCase()}) ${formatOption(q.options[idx])}`;
                    }
                    if (/^[0-9]+$/.test(normalized)) {
                        const idx = parseInt(normalized, 10);
                        if (q.options[idx]) return `${idx}) ${formatOption(q.options[idx])}`;
                    }
                    const found = q.options.find(opt => String(opt).trim().toLowerCase() === normalized.toLowerCase());
                    if (found) return formatOption(found);
                }

                return raw;
            } else if (subType === 'Multiple Select Question (MSQ)') {
                const raw = fromQ(['correctAnswers', 'correctAnswer', 'answer', 'options']);
                if (!raw || raw === 'N/A') return 'N/A';

                if (Array.isArray(q.options)) {
                    const normalizedItems = String(raw).split(/[\s,;]+/).map(x => x.trim()).filter(Boolean);
                    const mapped = normalizedItems.map(item => {
                        if (/^[A-Za-z]$/.test(item)) {
                            const idx = item.toUpperCase().charCodeAt(0) - 65;
                            if (q.options[idx]) return `${item.toUpperCase()}) ${formatOption(q.options[idx])}`;
                        }
                        return item;
                    });
                    return mapped.join(', ');
                }

                return raw;
            }
        }

        if (questionType === 'One-word Answer') {
            const raw = fromQ(['correctAnswer', 'answer', 'correct', 'correctAnswers']);
            if (!raw) return 'N/A';
            return String(raw).replace(/^[A-Da-d][\)\.][\s]*/g, '').trim();
        }

        if (questionType === 'True/False') {
            if (Array.isArray(q.correctAnswers) && q.correctAnswers.length > 0) {
                return q.correctAnswers.map((val, idx) => `${String.fromCharCode(97 + idx)}) ${String(val).trim()}`).join(', ');
            }
            const rawTF = fromQ(['correctAnswers', 'correctAnswer', 'answer', 'correct']);
            if (rawTF) {
                const parts = String(rawTF).split(/[\r\n]+/).map(line => line.trim()).filter(Boolean);
                if (parts.length >= 4) {
                    return parts.map((line, idx) => `${String.fromCharCode(97 + idx)}) ${line.replace(/^[A-Da-d][\)\.][\s]*/g, '').trim()}`).join(', ');
                }
                return String(rawTF).replace(/^[A-Da-d][\)\.][\s]*/g, '').trim();
            }
            return 'N/A';
        }

        if (questionType === 'Short Answer') {
            return fromQ(['answer', 'correctAnswer', 'detailedAnswer']) || 'N/A';
        }

        if (questionType === 'Long Answer') {
            return fromQ(['detailedAnswer', 'answer', 'correctAnswer']) || 'N/A';
        }

        return fromQ(['answer', 'correctAnswer', 'detailedAnswer']) || 'N/A';
    }

    function displayQuestions(questions, subject, chapter, level, stream, marks, questionType, specificTopics) {
        questionsContainer.innerHTML = `
            <div style="margin-bottom: 30px; padding: 20px; background: rgba(102, 126, 234, 0.1); border-radius: 12px; border-left: 4px solid #667eea;">
                <h2 style="color: #667eea; margin-bottom: 8px;">📋 Generated Questions</h2>
                <p style="opacity: 0.8;">Level: <strong>${level}</strong> | Subject: <strong>${subject}</strong> | Chapter: <strong>${chapter}</strong> | Marks: <strong>${marks}</strong> | Type: <strong>${questionType}</strong></p>
                ${stream ? `<p style="opacity: 0.8;">Stream: <strong>${stream}</strong></p>` : ''}
                ${specificTopics ? `<p style="opacity: 0.8;">Specific Topics: <strong>${specificTopics}</strong></p>` : ''}
                <p style="opacity: 0.7; margin-top: 4px; font-size: 0.9rem;">Total: <strong>${questions.length}</strong> question(s)</p>
            </div>

            <div style="text-align: center; margin-bottom: 30px;">
                <button id="saveAllQuestionsBtn" style="padding: 12px 24px; background: linear-gradient(135deg, #22c55e, #16a34a); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);">
                    💾 Save All Questions
                </button>
            </div>
        `;

        // Add event listener to the save button
        setTimeout(() => {
            const saveBtn = document.getElementById('saveAllQuestionsBtn');
            if (saveBtn) {
                saveBtn.addEventListener('click', () => {
                    saveBtn.disabled = true;
                    saveBtn.textContent = '⏳ Saving...';
                    saveGeneratedQuestions(questions, subject, chapter, level, stream, marks, questionType, specificTopics);
                    setTimeout(() => {
                        saveBtn.disabled = false;
                        saveBtn.textContent = '💾 Save All Questions';
                    }, 2000);
                });
            }
        }, 100);

        questions.forEach((q, index) => {
            const questionDiv = document.createElement('div');
            questionDiv.className = 'question-card';

            let contentHtml = '';

            if (questionType === 'Multiple Choice Question (MCQ)') {
                // For MCQ, backend should generate mix of types
                const subType = q.subType || 'Single Correct MCQ';
                if (subType === 'Single Correct MCQ') {
                    contentHtml = `
                        <strong>Question:</strong><br>${q.text}<br><br>
                        <strong>Options:</strong><br>
                        ${q.options ? q.options.map((opt, i) => `${String.fromCharCode(65 + i)}) ${formatOption(opt)}`).join('<br>') : 'A) Option1<br>B) Option2<br>C) Option3<br>D) Option4'}<br><br>
                        <strong>Correct Answer:</strong> ${getResolvedAnswer(q, questionType)}
                    `;
                } else if (subType === 'Multiple Select Question (MSQ)') {
                    contentHtml = `
                        <strong>Question:</strong><br>${q.text}<br>
                        <em style="opacity:0.8;">(Select all that apply)</em><br><br>
                        <strong>Options:</strong><br>
                        ${q.options ? q.options.map((opt, i) => `${String.fromCharCode(65 + i)}) ${formatOption(opt)}`).join('<br>') : 'A) Option1<br>B) Option2<br>C) Option3<br>D) Option4<br>E) Option5'}<br><br>
                        <strong>Correct Answers:</strong> ${getResolvedAnswer(q, questionType)}
                    `;
                } else if (subType === 'One-word Answer') {
                    contentHtml = `
                        <strong>Question:</strong><br>${q.text}<br><br>
                        <strong>Answer:</strong> ${getResolvedAnswer(q, questionType)}
                    `;
                } else if (subType === 'True/False') {
                    const statements = Array.isArray(q.statements)
                        ? q.statements.slice(0, 4)
                        : q.options && Array.isArray(q.options)
                            ? q.options.slice(0, 4)
                            : q.statement
                                ? [q.statement]
                                : [q.text || 'Statement 1', 'Statement 2', 'Statement 3', 'Statement 4'];

                    const questionTypes = [
                        'Which of the following statements are True?',
                        'Which of the following statements are False?',
                        'Identify the True statements from the following:',
                        'Identify the False statements from the following:'
                    ];
                    const questionTypeText = q.questionType || questionTypes[Math.floor(Math.random() * questionTypes.length)];
                    
                    const stmtHtml = statements.map((st, i) => `${String.fromCharCode(97 + i)}) ${formatOption(st)}`).join('<br>');
                    const answerText = getResolvedAnswer(q, questionType);

                    contentHtml = `
                        <strong>Question:</strong> ${questionTypeText}<br><br>
                        <strong>Statements:</strong><br>${stmtHtml}<br><br>
                        <strong>Answer:</strong> ${answerText}
                    `;
                }
            } else if (questionType === 'One-word Answer') {
                contentHtml = `
                    <strong>Question:</strong><br>${q.text}<br><br>
                    <strong>Answer:</strong> ${getResolvedAnswer(q, questionType)}
                `;
            } else if (questionType === 'True/False') {
                const statements = Array.isArray(q.statements)
                    ? q.statements.slice(0, 4)
                    : q.options && Array.isArray(q.options)
                        ? q.options.slice(0, 4)
                        : q.statement
                            ? [q.statement]
                            : [q.text || 'Statement 1', 'Statement 2', 'Statement 3', 'Statement 4'];

                const questionTypes = [
                    'Which of the following statements are True?',
                    'Which of the following statements are False?',
                    'Identify the True statements from the following:',
                    'Identify the False statements from the following:'
                ];
                const questionTypeText = q.questionType || questionTypes[Math.floor(Math.random() * questionTypes.length)];
                
                const stmtHtml = statements.map((st, i) => `${String.fromCharCode(97 + i)}) ${formatOption(st)}`).join('<br>');
                const answerText = getResolvedAnswer(q, questionType);

                contentHtml = `
                    <strong>Question:</strong> ${questionTypeText}<br><br>
                    <strong>Statements:</strong><br>${stmtHtml}<br><br>
                    <strong>Answer:</strong> ${answerText}
                `;
            } else if (questionType === 'Short Answer') {
                contentHtml = `
                    <strong>Question:</strong><br>${q.text}<br><br>
                    <strong>Answer (3-4 lines):</strong><br>${getResolvedAnswer(q, questionType)}
                `;
            } else if (questionType === 'Long Answer') {
                contentHtml = `
                    <strong>Question:</strong><br>${q.text}<br><br>
                    <strong>Detailed Answer (5-7 lines):</strong><br>${getResolvedAnswer(q, questionType)}
                `;
            } else {
                // Fallback
                contentHtml = q.text || 'Question text missing';
            }

            questionDiv.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 8px;">
                    <div class="question-number">Question ${q.questionNumber || index + 1}</div>
                    <span style="background: rgba(102, 126, 234, 0.2); padding: 4px 12px; border-radius: 6px; font-size: 0.8rem; color: #667eea;">
                        ${marks} | ${questionType}
                    </span>
                </div>
                <div class="question-text" style="font-size: 1rem; margin: 10px 0; line-height: 1.5;">${contentHtml}</div>
            `;

            questionsContainer.appendChild(questionDiv);
        });
    }

    function getCurrentTeacherEmail() {
        const user = JSON.parse(localStorage.getItem('qnario_current_user') || 'null');
        return user && user.role === 'teacher' ? user.email : 'default_teacher@example.com';
    }

    function saveGeneratedQuestions(questions, subject, chapter, level, stream, marks, questionType, specificTopics) {
        const teacherEmail = getCurrentTeacherEmail();
        
        // Prepare data for API
        const data = {
            teacherEmail,
            level,
            stream,
            subject,
            chapter,
            marks,
            questionType,
            specificTopics,
            questions: questions
        };
        
        // Send to API
        fetch('/api/save-generated-questions', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        })
        .then(response => response.json())
        .then(result => {
            if (result.success) {
                console.log('✅ Questions saved to database:', result.id);
                alert('Questions saved successfully!');
            } else {
                console.error('❌ Failed to save questions:', result.error);
                alert('Failed to save questions: ' + result.error);
            }
        })
        .catch(error => {
            console.error('❌ Error saving questions:', error);
            alert('Error saving questions. Please try again.');
        });
    }

    // Check if API key is set
    window.addEventListener('load', () => {
        console.log('✅ Teacher AI Question Generator loaded');
        console.log('✨ Select Level → Stream (if UG) → Subject → Chapter → Marks → Question Type → Generate');
    });
</script>
