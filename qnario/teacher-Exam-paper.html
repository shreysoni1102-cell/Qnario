<!DOCTYPE html>
<html lang="en">
<head>
    <title>Qnario – Exam Paper Sets</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:600,700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            background: linear-gradient(-45deg, #0f0c29, #1a1a3a, #24243e, #302b63);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
            padding: 40px 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 0 40px rgba(102,126,234,0.25);
        }

        h2 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 30px;
            background: linear-gradient(90deg, #667eea, #4facfe);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .filter-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
            border-radius: 14px;
            background: rgba(255,255,255,0.04);
        }

        th, td {
            padding: 14px 12px;
            text-align: left;
            font-size: 0.9rem;
        }

        th {
            background: rgba(255,255,255,0.08);
            font-weight: 700;
        }

        tr {
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        tr:last-child {
            border-bottom: none;
        }

        td.actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 14px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            color: white;
            transition: 0.3s ease;
        }

        .btn-preview {
            background: linear-gradient(135deg, #667eea, #4facfe);
            box-shadow: 0 0 15px rgba(79,172,254,0.4);
        }
        .btn-preview:hover { box-shadow: 0 0 25px rgba(79,172,254,0.6); transform: translateY(-2px); }

        .btn-download {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 0 15px rgba(16,185,129,0.4);
        }
        .btn-download:hover { box-shadow: 0 0 25px rgba(16,185,129,0.6); transform: translateY(-2px); }

        .btn-delete {
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            box-shadow: 0 0 15px rgba(239,68,68,0.4);
        }
        .btn-delete:hover { box-shadow: 0 0 25px rgba(239,68,68,0.6); transform: translateY(-2px); }

        .btn-answer {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            box-shadow: 0 0 15px rgba(245,158,11,0.4);
        }
        .btn-answer:hover { box-shadow: 0 0 25px rgba(245,158,11,0.6); transform: translateY(-2px); }

        td:first-child {
            background: rgba(102, 126, 234, 0.1);
            font-weight: 600;
            color: #4facfe;
        }

        th:first-child {
            background: rgba(102, 126, 234, 0.2);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .empty-state a {
            color: #4facfe;
            font-weight: 600;
            text-decoration: none;
        }

        .empty-state a:hover {
            text-decoration: underline;
        }

        /* Modal Styles Placeholder */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-content {
            background: #1e1e2f;
            padding: 30px;
            border-radius: 16px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }
        .close-modal {
            position: absolute;
            right: 20px;
            top: 20px;
            cursor: pointer;
            font-size: 1.5rem;
            color: #ef4444;
        }

        @media (max-width: 900px) {
            .container { padding: 20px; }
            table, thead, tbody, th, td, tr { display: block; }
            th { display: none; }
            tr { margin-bottom: 20px; padding: 14px; background: rgba(255,255,255,0.05); border-radius: 12px; }
            td { border: none; padding: 6px 0; }
            td.actions { margin-top: 10px; }
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Saved Exam Papers</h2>

    <div class="filter-bar">
        <a href="teacher-papers.html" style="padding: 10px 20px; background: rgba(255,255,255,0.1); color: white; border-radius: 10px; text-decoration: none; font-weight: 600;">⬅️ Back</a>
        <a href="teacher-create-exam.html" style="padding: 10px 20px; background: linear-gradient(135deg, #667eea, #4facfe); color: white; border-radius: 10px; text-decoration: none; font-weight: 600;">➕ Create New Paper</a>
    </div>

    <div id="tableContainer">
        <!-- JS fills this -->
    </div>
</div>

<div class="modal" id="previewModal">
    <div class="modal-content">
        <span class="close-modal" id="closePreviewModal">&times;</span>
        <h3 style="margin-bottom: 20px; color: #4facfe;">Paper Preview</h3>
        <div id="previewContent" style="line-height: 1.6;"></div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        renderTable();
    });

    function renderTable() {
        const papers = JSON.parse(localStorage.getItem("teacherPapers") || "[]");
        const container = document.getElementById("tableContainer");

        if (papers.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    No generated papers found. <br><br>
                    <a href="teacher-create-exam.html">Create a New Paper</a>
                </div>
            `;
            return;
        }

        let tableHtml = `
            <table>
                <thead>
                    <tr>
                        <th>Date & Time</th>
                        <th>Level</th>
                        <th>Subject</th>
                        <th>Chapter/Topics</th>
                        <th>Sections</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
        `;

        papers.reverse().forEach(p => {
            const dateObj = new Date(p.date);
            const dateStr = dateObj.toLocaleDateString() + ' ' + dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            const sectionsList = Object.keys(p.sections || {}).join(', ');

            tableHtml += `
                <tr>
                    <td>${dateStr}</td>
                    <td>${p.level}</td>
                    <td>${p.subject}</td>
                    <td>${p.chapter} ${p.topics ? `(${p.topics})` : ''}</td>
                    <td>${sectionsList}</td>
                    <td class="actions">
                        <button class="btn btn-preview" onclick="previewPaper('${p.id}')">Preview</button>
                        <button class="btn btn-answer" onclick="showPaperAnswers('${p.id}')">Answers</button>
                        <button class="btn btn-download" onclick="downloadPdf('${p.id}')">Download</button>
                        <button class="btn btn-delete" onclick="deletePaper('${p.id}')">Delete</button>
                    </td>
                </tr>
            `;
        });

        tableHtml += `</tbody></table>`;
        container.innerHTML = tableHtml;
    }

    window.deletePaper = function(id) {
        if(confirm('Are you sure you want to delete this paper?')) {
            let papers = JSON.parse(localStorage.getItem("teacherPapers") || "[]");
            papers = papers.filter(p => p.id !== id);
            localStorage.setItem("teacherPapers", JSON.stringify(papers));
            renderTable();
        }
    }

    const modal = document.getElementById('previewModal');
    const previewContent = document.getElementById('previewContent');
    const closePreviewModal = document.getElementById('closePreviewModal');

    closePreviewModal.onclick = () => modal.style.display = "none";
    window.onclick = (e) => { if(e.target == modal) modal.style.display = "none"; }

    window.previewPaper = function(id) {
        const papers = JSON.parse(localStorage.getItem("teacherPapers") || "[]");
        const paper = papers.find(p => p.id === id);
        if(!paper) return;

        let html = `
            <div style="margin-bottom: 20px; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 8px;">
                <strong>Level:</strong> ${paper.level} | <strong>Subject:</strong> ${paper.subject} <br>
                <strong>Chapter:</strong> ${paper.chapter} ${paper.topics ? `(${paper.topics})` : ''}
            </div>
        `;

        for(const secKey in paper.sections) {
            const sec = paper.sections[secKey];
            html += `<h4 style="color:#4facfe; margin-top: 20px; font-size:1.2rem;">${secKey} (${sec.marks} - ${sec.structure})</h4>`;
            
            sec.questions.forEach((q, idx) => {
                const cleanText = q.text ? q.text.replace(/\\n/g, '<br>').replace(/\*\*/g, '') : '';
                html += `
                    <div style="margin-bottom: 12px; padding-left: 10px; border-left: 2px solid rgba(255,255,255,0.2);">
                        <strong>${idx+1}.</strong> ${cleanText}
                    </div>
                `;
            });
        }

        previewContent.innerHTML = html;
        modal.style.display = "flex";
    }

    window.showPaperAnswers = function(id) {
        const papers = JSON.parse(localStorage.getItem("teacherPapers") || "[]");
        const paper = papers.find(p => p.id === id);
        if(!paper) return;

        let html = `<div style="margin-bottom: 20px; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 8px;">
                        <strong>Level:</strong> ${paper.level} | <strong>Subject:</strong> ${paper.subject} <br>
                        <strong>Chapter:</strong> ${paper.chapter} ${paper.topics ? `(${paper.topics})` : ''}
                    </div>`;

        for(const secKey in paper.sections) {
            const sec = paper.sections[secKey];
            html += `<h4 style="color:#4facfe; margin-top: 20px; font-size:1.2rem;">${secKey} (${sec.marks} - ${sec.structure})</h4>`;

            sec.questions.forEach((q, idx) => {
                let answerText = 'N/A';
                if (q.correctAnswer) answerText = q.correctAnswer;
                else if (q.correctAnswers) answerText = q.correctAnswers;
                else if (q.answer && typeof q.answer === 'string') answerText = q.answer;
                else if (q.answer && q.answer.correctOption) answerText = q.answer.correctOption;
                else if (q.detailedAnswer) answerText = q.detailedAnswer;

                html += `<div style="margin-bottom: 12px; padding-left: 10px; border-left: 2px solid rgba(255,255,255,0.2);">
                            <strong>${idx+1}.</strong> ${q.text || ''}<br>
                            <span style="color:#facc15;"><strong>Answer:</strong></span> ${answerText}
                        </div>`;
            });
        }

        previewContent.innerHTML = html;
        modal.style.display = 'flex';
    };

    window.downloadPdf = function(id) {
        // Implement simple pdf download using jsPDF (imported in head)
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        const papers = JSON.parse(localStorage.getItem("teacherPapers") || "[]");
        const paper = papers.find(p => p.id === id);
        if(!paper) return;

        doc.setFontSize(16);
        doc.text("Qnario Exam Paper", 10, 15);
        
        doc.setFontSize(11);
        doc.text(`Level: ${paper.level}`, 10, 25);
        doc.text(`Subject: ${paper.subject}`, 10, 32);
        doc.text(`Chapter: ${paper.chapter} ${paper.topics ? `(${paper.topics})` : ''}`, 10, 39);

        let yPos = 50;

        for(const secKey in paper.sections) {
            const sec = paper.sections[secKey];
            
            if(yPos > 270) { doc.addPage(); yPos = 20; }
            
            doc.setFontSize(13);
            doc.setFont("helvetica", "bold");
            doc.text(`${secKey} (${sec.marks} - ${sec.structure})`, 10, yPos);
            yPos += 8;

            doc.setFontSize(11);
            doc.setFont("helvetica", "normal");
            
            sec.questions.forEach((q, idx) => {
                const cleanText = q.text ? q.text.replace(/\\n/g, '').replace(/\*\*/g, '') : '';
                const lines = doc.splitTextToSize(`${idx + 1}. ${cleanText}`, 180);
                
                if(yPos + (lines.length * 6) > 280) {
                    doc.addPage();
                    yPos = 20;
                }
                
                doc.text(lines, 10, yPos);
                yPos += (lines.length * 6) + 4;
            });
            yPos += 5;
        }

        doc.save(`${paper.subject}_Paper.pdf`);
    }

</script>
</body>
</html>
