<!DOCTYPE html>
<html lang="en">
<head>
    <title>Qnario – Analytics Report</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:600,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(120deg, #f8fafc 0%, #e0e7ff 100%);
            min-height: 100vh;
            margin: 0;
            font-family: 'Montserrat', Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #background-video {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            object-fit: cover;
            z-index: -1;
            pointer-events: none;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.15);
            z-index: 0;
            pointer-events: none;
        }

        .card {
            background: #ffffff35;
            border-radius: 18px;
            box-shadow: 0 8px 32px rgba(60,60,120,0.12);
            padding: 36px 30px;
            max-width: 360px;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            z-index: 1;
            opacity: 1;
            transition: all 1s ease-out;
        }

        .card.fade-out {
            opacity: 0;
            transform: scale(0.95);
        }

        .logo {
            font-size: 2rem;
            font-weight: 700;
            color: #0f54c1;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #6366f1;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .category-btn {
            width: 100%;
            padding: 14px 0;
            border-radius: 10px;
            border: 2px solid rgba(255, 255, 255, 0.25);
            background: linear-gradient(
                135deg,
                rgba(62, 19, 146, 0.4),
                rgb(15, 38, 171),
                rgba(9, 216, 244, 0.4)
            );
            background-size: 300% 300%;
            animation: buttonGradient 12s ease infinite;
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            margin: 10px 0;
            text-decoration: none;
            display: block;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .category-btn:hover {
            transform: translateY(-2px) scale(1.02);
            border-color: rgba(255, 255, 255, 0.4);
            background: linear-gradient(
                135deg,
                rgba(6, 94, 149, 0.714),
                rgba(6, 73, 180, 0.877),
                rgba(29, 133, 147, 0.541)
            );
            background-size: 300% 300%;
            animation: buttonGradient 8s ease infinite;
        }

        @keyframes buttonGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @media (max-width: 500px) {
            .card {
                padding: 28px 20px;
            }
            .logo {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <video autoplay muted loop playsinline id="background-video">
        <source src="video/20833-312432050_small.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <div class="overlay"></div>

    <div class="card">
        <div class="logo">Qnario</div>
        <div class="subtitle">Analytics Report</div>
        <div class="categories">
            <a href="teacher-analytics.html" class="category-btn">Teacher Analytics</a>
            <a href="student-analytics.html" class="category-btn" id="student-analytics-card">Student Analytics</a>
        </div>
    </div>

    <script>
        // Redirect to login if not logged in as a student
        const studentAnalyticsCard = document.getElementById("student-analytics-card");
        studentAnalyticsCard.addEventListener("click", (event) => {
            const currentUser = JSON.parse(localStorage.getItem("qnario_current_user"));
            if (!currentUser || currentUser.role !== "student") {
                event.preventDefault();
                alert("You must be logged in as a student to view analytics.");
                const card = document.querySelector('.card');
                card.classList.add('fade-out');
                setTimeout(() => {
                    window.location.href = "student-login.html";
                }, 500);
            }
        });

        // Add transition for teacher analytics link
        document.querySelector('a[href="teacher-analytics.html"]').addEventListener("click", (e) => {
            e.preventDefault();
            const card = document.querySelector('.card');
            card.classList.add('fade-out');
            setTimeout(() => {
                window.location.href = "teacher-analytics.html";
            }, 500);
        });
    </script>
</body>
</html>
