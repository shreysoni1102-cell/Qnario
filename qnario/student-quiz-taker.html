<!DOCTYPE html>
<html lang="en">
<head>
    <title>QNARIO – Taking Quiz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter', sans-serif; background:#0f172a; color:white; min-height:100vh; overflow-x:hidden; }
        
        .navbar { display:flex; justify-content:space-between; align-items:center; padding:15px 40px; background:rgba(0,0,0,0.5); backdrop-filter:blur(10px); border-bottom:1px solid rgba(255,255,255,0.1); }
        .logo { font-family:'Space Grotesk',sans-serif; font-size:1.4rem; font-weight:700; background:linear-gradient(135deg,#667eea,#4facfe); background-clip:text; -webkit-background-clip:text; -webkit-text-fill-color:transparent; text-decoration:none; }
        
        .timer { font-family:'Space Grotesk', monospace; font-size:1.5rem; font-weight:700; color:#f87171; background:rgba(248,113,113,0.1); padding:8px 16px; border-radius:12px; }

        .layout { display:flex; padding:20px 40px; gap:30px; height:calc(100vh - 70px); }
        
        /* Main Question Area */
        .main-col { flex:1; display:flex; flex-direction:column; background:rgba(255,255,255,0.05); border-radius:20px; border:1px solid rgba(255,255,255,0.1); padding:30px; position:relative; }
        .question-header { display:flex; justify-content:space-between; margin-bottom:20px; opacity:0.8; font-size:0.9rem; font-weight:600; }
        .question-text { font-size:1.3rem; margin-bottom:30px; line-height:1.5; }
        
        .options-list { display:flex; flex-direction:column; gap:15px; }
        .option-item { background:rgba(255,255,255,0.08); padding:15px 20px; border-radius:12px; cursor:pointer; border:1px solid transparent; transition:0.2s; font-size:1.1rem; }
        .option-item:hover { background:rgba(255,255,255,0.15); }
        .option-item.selected { background:rgba(79,172,254,0.2); border-color:#4facfe; }

        .controls { display:flex; justify-content:space-between; margin-top:auto; padding-top:20px; }
        button { padding:12px 24px; border-radius:12px; border:none; font-weight:600; font-size:1rem; cursor:pointer; transition:0.3s; }
        .btn-secondary { background:rgba(255,255,255,0.1); color:white; }
        .btn-secondary:hover { background:rgba(255,255,255,0.2); }
        .btn-primary { background:linear-gradient(135deg,#667eea,#4facfe); color:white; }
        .btn-primary:hover { opacity:0.9; }
        .btn-warning { background:rgba(245,158,11,0.2); color:#f59e0b; border:1px solid transparent; }
        .btn-warning:hover { border-color:#f59e0b; }
        .btn-danger { background:rgba(239,68,68,0.2); color:#ef4444; }

        /* Palette Area */
        .side-col { width:300px; display:flex; flex-direction:column; background:rgba(255,255,255,0.05); border-radius:20px; border:1px solid rgba(255,255,255,0.1); padding:20px; }
        .palette-title { font-weight:700; margin-bottom:15px; text-align:center; }
        .palette-grid { display:grid; grid-template-columns:repeat(5, 1fr); gap:10px; margin-bottom:30px; }
        
        .pal-btn { width:100%; aspect-ratio:1; border-radius:8px; border:none; background:rgba(255,255,255,0.1); color:white; font-weight:600; cursor:pointer; font-size:1rem; }
        .pal-btn.answered { background:#34d399; color:black; }
        .pal-btn.review { background:#f59e0b; color:black; }
        .pal-btn.active { border:2px solid #fff; transform:scale(1.1); }

        .legend { margin-top:auto; display:flex; flex-direction:column; gap:10px; font-size:0.85rem; }
        .leg-item { display:flex; align-items:center; gap:10px; }
        .leg-box { width:15px; height:15px; border-radius:4px; }
        
        @media(max-width:900px){
            .layout { flex-direction:column; height:auto; }
            .side-col { width:100%; }
        }
    </style>
</head>
<body>

<div class="navbar">
    <a href="#" class="logo">QNARIO Quiz</a>
    <div class="timer" id="timerDisplay">00:00</div>
</div>

<div class="layout" id="quizLayout" style="display:none;">
    <div class="main-col">
        <div class="question-header">
            <span id="qNumber">Question 1</span>
            <span id="qSubject"></span>
        </div>
        <div class="question-text" id="qText">Loading...</div>
        <div class="options-list" id="qOptions"></div>
        
        <div class="controls">
            <div>
                <button class="btn-secondary" id="btnPrev">Previous</button>
            </div>
            <div>
                <button class="btn-warning" id="btnReview">Mark for Review</button>
                <button class="btn-secondary" id="btnClear" style="margin-left:8px;">Clear Response</button>
            </div>
            <div>
                <button class="btn-primary" id="btnNext">Next / Save</button>
            </div>
        </div>
    </div>
    
    <div class="side-col">
        <div class="palette-title">Question Palette</div>
        <div class="palette-grid" id="paletteGrid"></div>
        
        <button class="btn-danger" style="margin-top:20px; width:100%;" onclick="submitQuiz()">Submit Quiz</button>
        
        <div class="legend">
            <div class="leg-item"><div class="leg-box" style="background:rgba(255,255,255,0.1);"></div> Not Answered</div>
            <div class="leg-item"><div class="leg-box" style="background:#34d399;"></div> Answered</div>
            <div class="leg-item"><div class="leg-box" style="background:#f59e0b;"></div> Marked for Review</div>
        </div>
    </div>
</div>

<script>
    const user = JSON.parse(localStorage.getItem('qnario_current_user') || 'null');
    if (!user || user.role !== 'student') {
        window.location.href = 'student-login.html';
    }

    const urlParams = new URLSearchParams(window.location.search);
    const quizId = urlParams.get('id');
    if(!quizId) window.location.href = 'student-dashboard.html';

    let quizData = null;
    let currentQIndex = 0;
    let answersState = {}; // { q_id: { option: 'A', review: false, timeSpent: 0 } }
    let timeInterval = null;
    let lastQEnterTime = Date.now();
    let remainingSeconds = 0;

    async function loadQuiz() {
        try {
            const res = await fetch(`/api/exams/${quizId}`);
            if(!res.ok) throw new Error("Could not load Quiz");
            quizData = await res.json();
            
            // Generate basic duration if missing (fallback)
            remainingSeconds = (quizData.duration || 30) * 60; 
            
            // Initialize answers state
            quizData.questions.forEach(q => {
                answersState[q.id || q._id] = { option: null, review: false, timeSpent: 0, subject: q.subjectName, topic: q.topicName };
            });

            document.getElementById('quizLayout').style.display = 'flex';
            renderPalette();
            renderQuestion(currentQIndex);
            startTimer();

        } catch (e) {
            alert(e.message);
            window.location.href = 'student-dashboard.html';
        }
    }

    function startTimer() {
        timeInterval = setInterval(() => {
            if(remainingSeconds <= 0) {
                clearInterval(timeInterval);
                alert("Time's up! Auto-submitting quiz...");
                submitQuiz(true);
                return;
            }
            remainingSeconds--;
            const m = Math.floor(remainingSeconds / 60).toString().padStart(2, '0');
            const s = (remainingSeconds % 60).toString().padStart(2, '0');
            document.getElementById('timerDisplay').innerText = `${m}:${s}`;
        }, 1000);
    }

    function recordTimeSpent() {
        const now = Date.now();
        const diff = Math.round((now - lastQEnterTime) / 1000);
        const qId = getQid(currentQIndex);
        if(qId) answersState[qId].timeSpent += diff;
        lastQEnterTime = now;
    }

    function getQid(index) {
        if(!quizData || !quizData.questions[index]) return null;
        return quizData.questions[index].id || quizData.questions[index]._id;
    }

    function renderQuestion(index) {
        if(!quizData) return;
        const q = quizData.questions[index];
        const qId = getQid(index);
        
        document.getElementById('qNumber').innerText = `Question ${index + 1} of ${quizData.questions.length}`;
        document.getElementById('qSubject').innerText = q.subjectName || '';
        document.getElementById('qText').innerHTML = q.text;

        const optionsDiv = document.getElementById('qOptions');
        optionsDiv.innerHTML = '';
        
        if (q.options && q.options.length > 0) {
            q.options.forEach(opt => {
                const div = document.createElement('div');
                div.className = 'option-item';
                if(answersState[qId].option === opt.id) div.classList.add('selected');
                div.innerHTML = `<strong>${opt.id}.</strong> ${opt.text}`;
                div.onclick = () => selectOption(qId, opt.id);
                optionsDiv.appendChild(div);
            });
        }

        // BTN visibility
        document.getElementById('btnPrev').style.visibility = index === 0 ? 'hidden' : 'visible';
        document.getElementById('btnNext').innerText = index === quizData.questions.length - 1 ? 'Save & Finish' : 'Next / Save';
        
        lastQEnterTime = Date.now();
        updatePaletteStyles();
    }

    function selectOption(qId, optId) {
        answersState[qId].option = optId;
        renderQuestion(currentQIndex); // simple re-render for class update
    }

    function renderPalette() {
        const grid = document.getElementById('paletteGrid');
        grid.innerHTML = '';
        quizData.questions.forEach((q, idx) => {
            const btn = document.createElement('button');
            btn.className = 'pal-btn';
            btn.innerText = idx + 1;
            btn.onclick = () => {
                recordTimeSpent();
                currentQIndex = idx;
                renderQuestion(currentQIndex);
            };
            grid.appendChild(btn);
        });
    }

    function updatePaletteStyles() {
        const btns = document.querySelectorAll('.pal-btn');
        quizData.questions.forEach((q, idx) => {
            const qId = getQid(idx);
            const state = answersState[qId];
            let cls = 'pal-btn';
            if(idx === currentQIndex) cls += ' active';
            if(state.review) cls += ' review';
            else if(state.option) cls += ' answered';
            btns[idx].className = cls;
        });
    }

    // Events
    document.getElementById('btnNext').onclick = () => {
        recordTimeSpent();
        if(currentQIndex < quizData.questions.length - 1) {
            currentQIndex++;
            renderQuestion(currentQIndex);
        } else {
            submitQuiz();
        }
    };
    document.getElementById('btnPrev').onclick = () => {
        recordTimeSpent();
        if(currentQIndex > 0) {
            currentQIndex--;
            renderQuestion(currentQIndex);
        }
    };
    document.getElementById('btnReview').onclick = () => {
        const qId = getQid(currentQIndex);
        answersState[qId].review = !answersState[qId].review;
        updatePaletteStyles();
    };
    document.getElementById('btnClear').onclick = () => {
        const qId = getQid(currentQIndex);
        answersState[qId].option = null;
        renderQuestion(currentQIndex);
    };

    async function submitQuiz(force = false) {
        recordTimeSpent();
        if(!force) {
            const unans = Object.values(answersState).filter(a => !a.option).length;
            const msg = unans > 0 ? `You have ${unans} unanswered questions. Really submit?` : "Submit this quiz?";
            if(!confirm(msg)) return;
        }

        clearInterval(timeInterval);
        try {
            const payload = {
                answers: Object.keys(answersState).map(k => ({
                    questionId: k,
                    answer: answersState[k].option,
                    timeSpent: answersState[k].timeSpent
                }))
            };
            
            const res = await fetch(`/api/quizzes/${quizId}/submit`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-user-email': user.email
                },
                body: JSON.stringify(payload)
            });

            if(!res.ok) throw new Error("Submit failed");
            
            const resultData = await res.json();
            window.location.href = `student-quiz-result.html?resultId=${resultData.resultId}`;

        } catch(e) {
            alert(e.message);
        }
    }

    // Start
    loadQuiz();
</script>
</body>
</html>
