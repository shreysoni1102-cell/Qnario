<!DOCTYPE html>
<html lang="en">
<head>
    <title>Qnario – Paper Preview</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:600,700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            background: linear-gradient(-45deg, #0f0c29, #1a1a3a, #24243e, #302b63);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
            padding: 40px 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 0 40px rgba(102,126,234,0.25);
        }

        .title {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #667eea, #4facfe);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .meta-panel {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .meta-item {
            background: rgba(255,255,255,0.08);
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .question {
            margin-bottom: 28px;
            padding: 18px;
            border-radius: 14px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .q-text {
            font-weight: 600;
            margin-bottom: 10px;
        }

        .options {
            margin-left: 16px;
            margin-top: 8px;
        }

        .option {
            margin-bottom: 6px;
            font-size: 0.95rem;
            opacity: 0.9;
        }

        .answer-line {
            margin-top: 12px;
            height: 40px;
            background: rgba(255,255,255,0.06);
            border-radius: 8px;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }

        .btn {
            padding: 12px 28px;
            border-radius: 14px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.95rem;
            background: linear-gradient(135deg, #667eea, #4facfe);
            color: white;
            transition: 0.3s ease;
            box-shadow: 0 0 20px rgba(79,172,254,0.4);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 30px rgba(79,172,254,0.6);
        }

        .error {
            text-align: center;
            margin: 80px 0;
            font-size: 1.1rem;
            color: #ff6b6b;
        }

        .error a {
            color: #4facfe;
            text-decoration: none;
            font-weight: 600;
        }

        .error a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .container {
                padding: 24px;
            }
        }

        @media print {
            body {
                background: white;
                color: black;
            }
            .container {
                background: white;
                box-shadow: none;
            }
            .actions {
                display: none;
            }
        }
    </style>
</head>

<body>

<div class="container" id="mainContainer">
    <!-- Content rendered by JS -->
</div>

<script>
/* ===========================
   BACKEND LOGIC UNCHANGED
   =========================== */

function getQueryParam(name) {
    const url = new URL(window.location.href);
    return url.searchParams.get(name);
}

function getCurrentTeacherEmail() {
    const user = JSON.parse(localStorage.getItem('qnario_current_user') || 'null');
    return user && user.role === 'teacher' ? user.email : null;
}

const paperId = getQueryParam('paperId');
const teacherEmail = getCurrentTeacherEmail();
let errorMsg = '';
let paper = null;

if (!teacherEmail) {
    errorMsg = 'You are not logged in as a teacher. <a href="teacher-login.html">Login</a>';
} else if (!paperId) {
    errorMsg = 'No paper specified. <a href="teacher-dashboard.html">Back to Dashboard</a>';
} else {
    const papers = JSON.parse(localStorage.getItem('qnario_papers') || '{}');
    const teacherPapers = papers[teacherEmail] || [];
    paper = teacherPapers.find(p => p.id === paperId);
    if (!paper) {
        errorMsg = 'Paper not found. <a href="teacher-dashboard.html">Back to Dashboard</a>';
    }
}

function renderPaper(paper) {
    const meta = paper.meta;
    const dateStr = new Date(meta.createdAt).toLocaleDateString();
    let html = `
        <div class="title">${meta.examType} Exam Paper (${dateStr})</div>
        <div class="meta-panel">
            <div class="meta-item">Type: ${meta.type}</div>
            <div class="meta-item">Difficulty: ${meta.difficulty}</div>
            <div class="meta-item">Questions: ${meta.count}</div>
        </div>
    `;

    paper.questions.forEach((q, idx) => {
        html += `<div class="question">
            <div class="q-text">${idx + 1}. ${q.text}</div>`;
        if (q.type === "MCQ" && Array.isArray(q.options)) {
            html += `<div class="options">`;
            q.options.forEach((opt, i) => {
                html += `<div class="option"><b>${String.fromCharCode(65 + i)}.</b> ${opt}</div>`;
            });
            html += `</div>`;
        }
        if (q.type === "Descriptive" || q.type === "Short Answer") {
            html += `<div class="answer-line"></div>`;
        }
        html += `</div>`;
    });

    html += `
        <div class="actions">
            <button class="btn" onclick="window.location.href='teacher-create-exam.html'">Back</button>
            <button class="btn" onclick="downloadPDF()">Download PDF</button>
        </div>
    `;

    document.getElementById('mainContainer').innerHTML = html;
}

function renderError(msg) {
    document.getElementById('mainContainer').innerHTML =
        `<div class="error">${msg}</div>`;
}

if (errorMsg) {
    renderError(errorMsg);
} else {
    renderPaper(paper);
}

function downloadPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'pt', format: 'a4' });
    const meta = paper.meta;
    let y = 48;
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(20);
    doc.text(`${meta.examType} Exam Paper`, 40, y);
    doc.setFontSize(12);
    doc.setFont('helvetica', 'normal');
    y += 24;
    doc.text(`Date: ${new Date(meta.createdAt).toLocaleDateString()}`, 40, y);
    y += 18;
    doc.text(`Type: ${meta.type}    Difficulty: ${meta.difficulty}    Questions: ${meta.count}`, 40, y);
    y += 28;

    paper.questions.forEach((q, idx) => {
        if (y > 760) { doc.addPage(); y = 48; }
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(13);
        doc.text(`${idx + 1}. ${q.text}`, 40, y);
        y += 18;
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(12);
        if (q.type === "MCQ" && Array.isArray(q.options)) {
            q.options.forEach((opt, i) => {
                doc.text(`   ${String.fromCharCode(65 + i)}. ${opt}`, 60, y);
                y += 16;
            });
        }
        if (q.type === "Descriptive" || q.type === "Short Answer") {
            doc.text("   ________________________________", 60, y);
            y += 18;
        }
        y += 8;
    });

    doc.save(`${meta.examType}_Paper_${paper.id}.pdf`);
}
</script>

</body>
</html>
