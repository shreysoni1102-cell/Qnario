<!DOCTYPE html>
<html lang="en">
<head>
    <title>QNARIO – Create Quiz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter', sans-serif; background:#0f172a; color:white; min-height:100vh; overflow-x:hidden; }
        
        /* BACKGROUND */
        .bg-wrapper { position:fixed; inset:0; z-index:-2; overflow:hidden; }
        .gradient-mesh {
            position:absolute; width:140%; height:140%;
            background: radial-gradient(circle at 20% 30%, #667eea55, transparent 40%),
                        radial-gradient(circle at 80% 70%, #4facfe55, transparent 40%),
                        radial-gradient(circle at 50% 50%, #764ba255, transparent 40%);
            filter:blur(120px); animation:meshMove 20s ease-in-out infinite alternate;
        }
        @keyframes meshMove { 0% {transform:translate(0,0) scale(1);} 100% {transform:translate(-5%,5%) scale(1.1);} }
        .grid-overlay {
            position:absolute; inset:0;
            background-image: linear-gradient(rgba(255,255,255,0.05) 1px,transparent 1px),
                              linear-gradient(90deg,rgba(255,255,255,0.05) 1px,transparent 1px);
            background-size:60px 60px;
        }

        /* NAVBAR */
        .navbar { display:flex; justify-content:space-between; align-items:center; padding:20px 60px; }
        .logo { font-family:'Space Grotesk',sans-serif; font-size:1.6rem; font-weight:700; background:linear-gradient(135deg,#667eea,#4facfe); background-clip:text; -webkit-background-clip:text; -webkit-text-fill-color:transparent; text-decoration:none; }

        /* LAYOUT */
        .wrapper { display:flex; justify-content:center; padding:20px; }
        .container { width:100%; max-width:650px; background:rgba(255,255,255,0.05); backdrop-filter:blur(25px); border:1px solid rgba(255,255,255,0.1); border-radius:22px; padding:40px; box-shadow:0 20px 60px rgba(0,0,0,0.4); }
        h2 { text-align:center; font-family:'Space Grotesk',sans-serif; font-size:2rem; margin-bottom:10px; }
        .subtitle { text-align:center; color:rgba(255,255,255,0.7); margin-bottom:30px; }

        /* FORM */
        .form-grid { display:grid; grid-template-columns: 1fr 1fr; gap:20px; }
        .full-width { grid-column: 1 / -1; }
        
        .form-group { display:flex; flex-direction:column; gap:8px; }
        label { font-weight:500; font-size:0.9rem; opacity:0.9; }
        
        input, select {
            width:100%; padding:14px; border-radius:12px; border:1px solid rgba(255,255,255,0.15);
            background:rgba(255,255,255,0.06); color:white; font-size:0.95rem; outline:none; transition:0.3s;
        }
        input:focus, select:focus { border-color:#4facfe; box-shadow:0 0 0 3px rgba(79,172,254,0.2); }
        select option { color:black; }

        /* DATE INPUT COLOR FIX FOR CHROME INTERFERING WITH WHITE TEXT */
        input[type="datetime-local"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }

        button {
            margin-top:20px; padding:16px; border-radius:14px; border:none; font-weight:700; font-size:1.1rem;
            color:white; cursor:pointer; background:linear-gradient(135deg,#667eea,#4facfe); transition:0.3s;
        }
        button:hover { transform:translateY(-2px); box-shadow:0 10px 30px rgba(79,172,254,0.4); }
        button:disabled { opacity:0.5; cursor:not-allowed; transform:none; box-shadow:none; }

        /* STATUS MESSAGES */
        .success { color:#34d399; text-align:center; margin-top:20px; padding:15px; background:rgba(52,211,153,0.1); border-radius:12px; border:1px solid rgba(52,211,153,0.2); display:none; }
        .error { color:#f87171; text-align:center; margin-top:20px; padding:15px; background:rgba(248,113,113,0.1); border-radius:12px; border:1px solid rgba(248,113,113,0.2); display:none; }
        
        .quiz-code-display { font-family:'Space Grotesk', monospace; font-size:2rem; font-weight:bold; letter-spacing:4px; color:#4facfe; margin:10px 0; }

        @media(max-width:600px) {
            .form-grid { grid-template-columns: 1fr; }
            .navbar { padding:20px; }
            .container { padding:25px; }
        }
    </style>
</head>
<body>

<div class="bg-wrapper"><div class="gradient-mesh"></div><div class="grid-overlay"></div></div>
<div class="navbar"><a href="teacher-dashboard.html" class="logo">QNARIO</a></div>

<div class="wrapper">
    <div class="container">
        <h2>Create a Smart Quiz</h2>
        <p class="subtitle">Set up timing, generate AI questions, and get a join code for students.</p>

        <form id="quizForm" autocomplete="off">
            <div class="form-grid">
                
                <div class="form-group full-width">
                    <label for="title">Quiz Title</label>
                    <input type="text" id="title" placeholder="e.g. Midterm Thermodynamics Test" required>
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" placeholder="e.g. Physics" required>
                </div>

                <div class="form-group">
                    <label for="topics">Topics (comma separated)</label>
                    <input type="text" id="topics" placeholder="e.g. Thermodynamics, Heat Transfer" required>
                </div>

                <div class="form-group">
                    <label for="duration">Duration (in minutes)</label>
                    <input type="number" id="duration" min="1" max="180" placeholder="e.g. 30" required>
                </div>

                <div class="form-group">
                    <label for="numQuestions">Number of AI Questions</label>
                    <input type="number" id="numQuestions" min="1" max="50" placeholder="e.g. 10" required>
                </div>

                <div class="form-group full-width">
                    <label for="difficulty">Difficulty Level</label>
                    <select id="difficulty" required>
                        <option value="Easy">Easy</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="Hard">Hard</option>
                        <option value="Mixed">Mixed (All Difficulties)</option>
                    </select>
                </div>

                <button type="submit" id="submitBtn" class="full-width">Generate & Publish Quiz</button>
            </div>
            
            <div id="formError" class="error"></div>
            <div id="formSuccess" class="success">
                <div>🎉 Quiz successfully created!</div>
                <div>Share this unique code with your students:</div>
                <div class="quiz-code-display" id="displayCode"></div>
                <button type="button" onclick="window.location.href='teacher-dashboard.html'">Back to Dashboard</button>
            </div>
        </form>
    </div>
</div>

<script>
    const user = JSON.parse(localStorage.getItem('qnario_current_user') || 'null');
    if (!user || user.role !== 'teacher') {
        window.location.href = 'teacher-login.html';
    }

    const form = document.getElementById('quizForm');
    const submitBtn = document.getElementById('submitBtn');
    const formError = document.getElementById('formError');
    const formSuccess = document.getElementById('formSuccess');
    const displayCode = document.getElementById('displayCode');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        // Hide previous messages
        formError.style.display = 'none';
        formSuccess.style.display = 'none';
        
        const title = document.getElementById('title').value;
        const subject = document.getElementById('subject').value;
        const topicsInput = document.getElementById('topics').value;
        const duration = parseInt(document.getElementById('duration').value);
        const numQuestions = parseInt(document.getElementById('numQuestions').value);
        const difficulty = document.getElementById('difficulty').value;

        submitBtn.disabled = true;
        submitBtn.innerText = 'Creating Quiz with AI... Please wait';

        try {
            // First, call the AI to generate questions using the existing endpoint
            const aiRes = await fetch('/api/generate-questions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    topic: topicsInput,
                    numQuestions: numQuestions,
                    subjectId: 'sub_' + Date.now(),
                    examId: 'temp',
                    subjectName: subject,
                    difficulty: difficulty === 'Mixed' ? 'Medium' : difficulty
                })
            });

            if(!aiRes.ok) throw new Error("Failed to generate AI questions.");
            const aiData = await aiRes.json();
            const questions = aiData.questions;

            // Second, call our new Quiz Creation endpoint
            const payload = {
                title,
                subject,
                topics: topicsInput.split(',').map(t => t.trim()),
                duration,
                difficulty,
                createdBy: user.email,
                questions: questions
            };

            const quizRes = await fetch('/api/quizzes/create', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-user-email': user.email
                },
                body: JSON.stringify(payload)
            });

            if(!quizRes.ok) {
                const qErr = await quizRes.json();
                throw new Error(qErr.error || "Failed to save Quiz.");
            }

            const quizData = await quizRes.json();

            // Success
            form.querySelector('.form-grid').style.display = 'none'; // hide form
            displayCode.innerText = quizData.quizCode;
            formSuccess.style.display = 'block';

        } catch (error) {
            console.error(error);
            showError(error.message);
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = 'Generate & Publish Quiz';
        }
    });

    function showError(msg) {
        formError.innerText = '❌ ' + msg;
        formError.style.display = 'block';
        window.scrollTo(0, document.body.scrollHeight);
    }
</script>
</body>
</html>
