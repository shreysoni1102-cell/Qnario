<!DOCTYPE html>
<html lang="en">
<head>
    <title>QNARIO – Exam Result</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;800&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Inter',sans-serif;background:#0a0e27;color:#fff;min-height:100vh;}
        .bg-wrapper{position:fixed;inset:0;z-index:-1;overflow:hidden;}
        .gradient-mesh{position:absolute;width:200%;height:200%;background:radial-gradient(circle at 20% 20%,#667eea 0%,transparent 40%),radial-gradient(circle at 80% 80%,#10b981 0%,transparent 40%);animation:moveMesh 20s infinite alternate;filter:blur(120px);opacity:0.45;}
        .grid-overlay{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.025) 1px,transparent 1px);background-size:40px 40px;}
        @keyframes moveMesh{0%{transform:translate(-10%,-10%)}100%{transform:translate(10%,10%)}}
        .topbar{position:fixed;top:0;width:100%;height:64px;display:flex;justify-content:space-between;align-items:center;padding:0 30px;backdrop-filter:blur(20px);background:rgba(0,0,0,0.4);z-index:200;border-bottom:1px solid rgba(255,255,255,0.07);}
        .logo{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:1.4rem;background:linear-gradient(135deg,#667eea,#4facfe);background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
        .page{padding:84px 24px 60px;max-width:860px;margin:0 auto;}
        .glass{background:rgba(255,255,255,0.05);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:32px;}

        /* LOADING */
        .loading{text-align:center;padding:80px 20px;}
        .spinner{width:56px;height:56px;border:4px solid rgba(102,126,234,0.2);border-top:4px solid #667eea;border-radius:50%;animation:spin 0.9s linear infinite;margin:0 auto 20px;}
        @keyframes spin{to{transform:rotate(360deg)}}

        /* SCORE CARD */
        .score-hero{text-align:center;padding:20px 0 30px;}
        .score-ring{position:relative;width:160px;height:160px;margin:0 auto 24px;}
        .score-ring svg{transform:rotate(-90deg);}
        .score-ring circle.bg{fill:none;stroke:rgba(255,255,255,0.07);stroke-width:12;}
        .score-ring circle.fill{fill:none;stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset 1.5s ease;}
        .score-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
        .score-pct-big{font-family:'Space Grotesk',sans-serif;font-size:2.2rem;font-weight:800;line-height:1;}
        .score-label{font-size:0.75rem;color:rgba(255,255,255,0.5);margin-top:4px;letter-spacing:1px;}
        .grade-badge{display:inline-block;padding:6px 22px;border-radius:30px;font-family:'Space Grotesk',sans-serif;font-size:1.1rem;font-weight:800;margin-top:12px;}
        .result-name{font-family:'Space Grotesk',sans-serif;font-size:1.6rem;font-weight:800;margin-bottom:6px;}
        .result-sub{color:rgba(255,255,255,0.5);font-size:0.9rem;}

        /* STATS ROW */
        .stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:28px;}
        .stat-box{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:16px;text-align:center;}
        .stat-num{font-size:1.5rem;font-weight:800;}
        .stat-label{font-size:0.72rem;color:rgba(255,255,255,0.45);margin-top:3px;letter-spacing:0.5px;}

        /* CHAPTER BREAKDOWN */
        .chapter-row{display:flex;align-items:center;gap:14px;padding:14px 18px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:12px;margin-bottom:10px;}
        .chapter-name{font-weight:600;font-size:0.92rem;flex:1;}
        .chapter-bar-wrap{flex:2;height:8px;border-radius:20px;background:rgba(255,255,255,0.08);overflow:hidden;}
        .chapter-bar-fill{height:100%;border-radius:20px;transition:width 1s ease;}
        .chapter-score{font-weight:700;font-size:0.88rem;white-space:nowrap;min-width:60px;text-align:right;}
        .chapter-tag{padding:2px 8px;border-radius:10px;font-size:0.68rem;font-weight:700;white-space:nowrap;}
        .tag-strong{background:rgba(16,185,129,0.2);color:#6ee7b7;border:1px solid rgba(16,185,129,0.3);}
        .tag-avg{background:rgba(245,158,11,0.15);color:#fcd34d;border:1px solid rgba(245,158,11,0.25);}
        .tag-weak{background:rgba(239,68,68,0.15);color:#fca5a5;border:1px solid rgba(239,68,68,0.25);}

        /* AI SUGGESTION */
        .suggestion-box{background:linear-gradient(135deg,rgba(167,139,250,0.1),rgba(102,126,234,0.05));border:1px solid rgba(167,139,250,0.3);border-radius:16px;padding:22px 24px;margin-bottom:20px;}
        .suggestion-title{font-weight:700;font-size:0.95rem;color:#a78bfa;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
        .suggestion-item{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;font-size:0.88rem;color:rgba(255,255,255,0.75);}
        .suggestion-dot{width:6px;height:6px;border-radius:50%;background:#a78bfa;margin-top:6px;flex-shrink:0;}

        .btn-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:28px;}
        .btn{padding:12px 26px;border-radius:12px;border:none;font-size:0.92rem;font-weight:700;cursor:pointer;transition:0.25s;display:inline-flex;align-items:center;gap:8px;}
        .btn-primary{background:linear-gradient(135deg,#667eea,#4facfe);color:#fff;}
        .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(102,126,234,0.4);}
        .btn-outline{background:rgba(255,255,255,0.07);color:#fff;border:1px solid rgba(255,255,255,0.15);}
        .btn-outline:hover{background:rgba(255,255,255,0.12);}

        .section-title{font-size:0.72rem;font-weight:700;letter-spacing:1px;color:rgba(255,255,255,0.4);margin-bottom:16px;}
        @media(max-width:600px){.stats-row{grid-template-columns:1fr 1fr;}.chapter-row{flex-wrap:wrap;}.page{padding:80px 14px 40px;}}
    </style>
</head>
<body>
<div class="bg-wrapper"><div class="gradient-mesh"></div><div class="grid-overlay"></div></div>
<div class="topbar">
    <div class="logo">QNARIO</div>
    <a href="student-dashboard.html" style="color:rgba(255,255,255,0.5);text-decoration:none;font-size:0.88rem;">← Dashboard</a>
</div>

<div class="page">
    <div id="loadingBox" class="glass"><div class="loading"><div class="spinner"></div><p style="color:rgba(255,255,255,0.5);">Loading your result...</p></div></div>

    <div id="resultContent" style="display:none;">

        <!-- SCORE CARD -->
        <div class="glass" style="margin-bottom:20px;">
            <div class="score-hero">
                <div class="score-ring">
                    <svg width="160" height="160" viewBox="0 0 160 160">
                        <circle class="bg" cx="80" cy="80" r="68"/>
                        <circle class="fill" id="scoreRingFill" cx="80" cy="80" r="68" stroke-dasharray="427" stroke-dashoffset="427"/>
                    </svg>
                    <div class="score-inner">
                        <div class="score-pct-big" id="scorePctBig">0%</div>
                        <div class="score-label">SCORE</div>
                    </div>
                </div>
                <div class="result-name" id="studentNameDisplay"></div>
                <div class="result-sub" id="subjectDisplay"></div>
                <div class="grade-badge" id="gradeBadge"></div>
            </div>

            <div class="stats-row">
                <div class="stat-box"><div class="stat-num" id="statScored" style="color:#4facfe;"></div><div class="stat-label">MARKS SCORED</div></div>
                <div class="stat-box"><div class="stat-num" id="statTotal" style="color:rgba(255,255,255,0.6);"></div><div class="stat-label">TOTAL MARKS</div></div>
                <div class="stat-box"><div class="stat-num" id="statTime" style="color:#a78bfa;"></div><div class="stat-label">SUBMITTED AT</div></div>
            </div>
        </div>

        <!-- CHAPTER BREAKDOWN -->
        <div class="glass" style="margin-bottom:20px;">
            <div class="section-title">CHAPTER-WISE PERFORMANCE</div>
            <div id="chapterBreakdown"></div>
        </div>

        <!-- AI SUGGESTIONS -->
        <div class="suggestion-box" id="suggestionBox" style="display:none;">
            <div class="suggestion-title">🧠 AI Study Suggestions</div>
            <div id="suggestionLoading" style="display:none; color: rgba(255,255,255,0.5); font-size: 0.9rem;">
                <span style="display:inline-block; animation:spin 1s linear infinite;">⏳</span> AI is analyzing your performance...
            </div>
            <div id="suggestionList"></div>
        </div>

        <div class="btn-row">
            <button class="btn btn-primary" onclick="window.print()">🖨️ Download / Print</button>
            <button class="btn btn-outline" onclick="window.location.href='student-syllabus-exam.html'">🔁 Attempt Another</button>
            <button class="btn btn-outline" onclick="window.location.href='student-dashboard.html'">🏠 Dashboard</button>
        </div>
    </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const resultId = params.get('resultId');

if (!resultId) {
    document.getElementById('loadingBox').innerHTML = '<div class="loading"><p style="color:#fca5a5;">No result ID provided.</p></div>';
} else {
    loadResult();
}

async function loadResult() {
    try {
        const resp = await fetch(`/api/exam-results/${resultId}`).then(r => r.json());
        if (!resp.success) throw new Error(resp.error || 'Result not found');
        renderResult(resp.result);
    } catch(e) {
        document.getElementById('loadingBox').innerHTML = `<div class="loading"><p style="color:#fca5a5;">Error: ${e.message}</p></div>`;
    }
}

function renderResult(r) {
    document.getElementById('loadingBox').style.display = 'none';
    document.getElementById('resultContent').style.display = 'block';

    const pct = parseFloat(r.percentage) || 0;

    // Ring animation
    const circumference = 427;
    const offset = circumference - (pct / 100) * circumference;
    const fill = document.getElementById('scoreRingFill');
    const color = pct >= 70 ? '#10b981' : pct >= 40 ? '#f59e0b' : '#ef4444';
    fill.style.stroke = color;
    setTimeout(() => { fill.style.strokeDashoffset = offset; }, 100);

    document.getElementById('scorePctBig').textContent = pct + '%';
    document.getElementById('studentNameDisplay').textContent = r.studentName || 'Student';
    document.getElementById('subjectDisplay').textContent = r.roomCode ? 'Room: ' + r.roomCode : 'Exam Result';
    document.getElementById('statScored').textContent = r.totalScore;
    document.getElementById('statTotal').textContent = r.totalMarks;
    document.getElementById('statTime').textContent = new Date(r.submittedAt).toLocaleTimeString();

    // Grade
    let grade = 'F', gradeBg = 'rgba(239,68,68,0.2)', gradeColor = '#fca5a5', gradeBorder = 'rgba(239,68,68,0.3)';
    if (pct >= 90) { grade='A+'; gradeBg='rgba(16,185,129,0.2)'; gradeColor='#6ee7b7'; gradeBorder='rgba(16,185,129,0.4)'; }
    else if (pct >= 75) { grade='A'; gradeBg='rgba(16,185,129,0.15)'; gradeColor='#6ee7b7'; gradeBorder='rgba(16,185,129,0.3)'; }
    else if (pct >= 60) { grade='B'; gradeBg='rgba(79,172,254,0.15)'; gradeColor='#7dd3fc'; gradeBorder='rgba(79,172,254,0.3)'; }
    else if (pct >= 45) { grade='C'; gradeBg='rgba(245,158,11,0.15)'; gradeColor='#fcd34d'; gradeBorder='rgba(245,158,11,0.3)'; }
    const gb = document.getElementById('gradeBadge');
    gb.textContent = 'Grade: ' + grade;
    gb.style.background = gradeBg; gb.style.color = gradeColor;
    gb.style.border = `1px solid ${gradeBorder}`;

    // Chapter breakdown
    const chapters = r.chapterStats || {};
    const container = document.getElementById('chapterBreakdown');
    const weakChapters = [];
    if (Object.keys(chapters).length === 0) {
        container.innerHTML = '<p style="color:rgba(255,255,255,0.3);text-align:center;padding:16px;">No chapter data available</p>';
    } else {
        container.innerHTML = Object.entries(chapters).map(([ch, s]) => {
            const cpct = s.marks > 0 ? Math.round((s.scored/s.marks)*100) : 0;
            const barColor = cpct>=70?'linear-gradient(90deg,#10b981,#34d399)':cpct>=40?'linear-gradient(90deg,#f59e0b,#fcd34d)':'linear-gradient(90deg,#ef4444,#f87171)';
            const tag = cpct>=70?'<span class="chapter-tag tag-strong">Strong</span>':cpct>=40?'<span class="chapter-tag tag-avg">Average</span>':'<span class="chapter-tag tag-weak">Needs Work</span>';
            if (cpct < 50) weakChapters.push({ ch, cpct });
            return `
            <div class="chapter-row">
                <div class="chapter-name">📖 ${ch}</div>
                <div class="chapter-bar-wrap"><div class="chapter-bar-fill" style="width:0%;background:${barColor}" data-pct="${cpct}"></div></div>
                <div class="chapter-score" style="color:${cpct>=70?'#6ee7b7':cpct>=40?'#fcd34d':'#fca5a5'}">${s.scored}/${s.marks}</div>
                ${tag}
            </div>`;
        }).join('');
        // Animate bars
        setTimeout(() => {
            container.querySelectorAll('.chapter-bar-fill').forEach(b => { b.style.width = b.dataset.pct + '%'; });
        }, 200);
    }

    // AI Suggestions
    if (weakChapters.length > 0) {
        const box = document.getElementById('suggestionBox');
        const list = document.getElementById('suggestionList');
        const loading = document.getElementById('suggestionLoading');
        
        box.style.display = 'block';
        loading.style.display = 'block';
        list.innerHTML = '';

        // Fetch actual AI insights
        fetch(`/api/exam-results/${resultId}/insights`)
            .then(res => res.json())
            .then(data => {
                loading.style.display = 'none';
                if (data.success && data.suggestions && data.suggestions.length > 0) {
                    list.innerHTML = data.suggestions.map(sug => 
                        `<div class="suggestion-item"><div class="suggestion-dot"></div>${sug}</div>`
                    ).join('');
                } else {
                    // Fallback
                    list.innerHTML = weakChapters.map(w =>
                        `<div class="suggestion-item"><div class="suggestion-dot"></div>Revise <strong>${w.ch}</strong> (Scored ${w.cpct}%). Focus on core concepts here.</div>`
                    ).join('');
                }
            })
            .catch(err => {
                loading.style.display = 'none';
                list.innerHTML = `<div class="suggestion-item" style="color:#fca5a5;"><div class="suggestion-dot" style="background:#ef4444;"></div>Failed to load personalized insights. Just focus on your weak chapters!</div>`;
            });
    }
}
</script>
</body>
</html>
