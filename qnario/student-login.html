<!DOCTYPE html>
<html lang="en">
<head>
<title>Qnario – Student Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* =========================
   GLOBAL RESET
========================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0f172a;
    color:white;
    overflow:hidden;
}

/* =========================
   BACKGROUND SYSTEM (MASTER THEME)
========================= */
.bg-wrapper{
    position:fixed;
    inset:0;
    z-index:-2;
}

.gradient-mesh{
    position:absolute;
    inset:0;
    background:
        radial-gradient(at 20% 30%, #667eea 0px, transparent 50%),
        radial-gradient(at 80% 20%, #764ba2 0px, transparent 50%),
        radial-gradient(at 40% 80%, #4facfe 0px, transparent 50%),
        radial-gradient(at 90% 70%, #00f2fe 0px, transparent 50%);
    filter:blur(120px);
    opacity:0.7;
}

.grid-overlay{
    position:absolute;
    inset:0;
    background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size:40px 40px;
    opacity:0.4;
}

 /* ===== VIDEO ===== */


#background-video{
    position:fixed;
    right:0;
    bottom:0;
    min-width:100%;
    min-height:100%;
    object-fit:cover;
    z-index:-2;
    pointer-events:none;
    opacity:0.35;
}
    

/* =========================
   LOGIN CARD
========================= */
.card{
    width:90%;
    max-width:400px;
    padding:45px 35px;
    border-radius:24px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(30px);
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:0 20px 60px rgba(0,0,0,0.4);
    text-align:center;
}

/* =========================
   LOGO
========================= */
.logo a{
    font-family:'Space Grotesk',sans-serif;
    font-size:30px;
    font-weight:700;
    text-decoration:none;
    background:linear-gradient(135deg,#667eea,#4facfe);
    background-clip:text;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.subtitle{
    margin-top:12px;
    margin-bottom:30px;
    font-size:15px;
    opacity:0.85;
}

/* =========================
   INPUTS
========================= */
input{
    width:100%;
    padding:14px 16px;
    margin-bottom:18px;
    border-radius:16px;
    border:1px solid rgba(255,255,255,0.08);
    background:rgba(255,255,255,0.06);
    color:white;
    font-size:14px;
    transition:0.3s;
}

input::placeholder{
    color:rgba(255,255,255,0.6);
}

input:focus{
    outline:none;
    border:1px solid rgba(102,126,234,0.7);
    box-shadow:0 0 0 3px rgba(102,126,234,0.2);
}

/* =========================
   BUTTON
========================= */
.login-btn{
    width:100%;
    padding:14px;
    border-radius:16px;
    border:none;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    color:white;
    background:linear-gradient(135deg,#667eea,#4facfe);
    transition:0.3s;
}

.login-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 15px 35px rgba(0,0,0,0.4);
}

/* =========================
   ERROR
========================= */
.error{
    margin-top:10px;
    font-size:13px;
    color:#ff6b6b;
    min-height:18px;
}

/* =========================
   FOOTER LINK
========================= */
.link{
    margin-top:22px;
    font-size:13px;
    opacity:0.85;
}

.link a{
    color:#4facfe;
    font-weight:600;
    text-decoration:none;
}

.link a:hover{
    text-decoration:underline;
}

@media(max-width:480px){
    .card{padding:35px 25px}
}
</style>
</head>

<body>

<!-- MASTER BACKGROUND -->
<div class="bg-wrapper">
    <div class="gradient-mesh"></div>
    <div class="grid-overlay"></div>
</div>


<!-- VIDEO (UNCHANGED) -->
<video autoplay muted loop playsinline id="background-video">
    <source src="video/18069232-uhd_3840_2160_24fps.mp4" type="video/mp4">
</video>

<div class="card">

    <div class="logo">
        <a href="index.html">QNARIO</a>
    </div>

    <div class="subtitle">Student Login</div>

    <form id="studentLoginForm" autocomplete="off">
        <input type="email" id="email" placeholder="Email address" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit" class="login-btn">Login</button>
        <div id="errorMsg" class="error"></div>
    </form>

    <div class="link">
        Don't have an account? <a href="signup.html">Sign Up</a>
    </div>

    <div class="link" style="margin-top: 15px; font-size: 0.9rem;">
        <a href="forgot-password.html" style="color: #667eea;">Forgot Password?</a>
    </div>

</div>

<!-- ===========================
     ORIGINAL BACKEND SCRIPT
     (UNCHANGED)
    =========================== -->
<script type="module">
import { login, isValidEmail } from './auth-utils.js';

document.getElementById('studentLoginForm').onsubmit = async function(e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();
    const errorMsg = document.getElementById('errorMsg');
    errorMsg.innerText = '';

    if (!email || !password) {
        errorMsg.innerText = 'Please enter both email and password.';
        return;
    }
    if (!isValidEmail(email)) {
        errorMsg.innerText = 'Please enter a valid email address (gmail, hotmail, edu.in, yahoo, outlook).';
        return;
    }

    try {
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password, role: 'student' })
        });
        const data = await res.json();
        if (data.success) {
            localStorage.setItem('qnario_current_user', JSON.stringify(data.user));
            window.location.href = 'student-dashboard.html';
        } else {
            errorMsg.innerText = data.error || 'Login failed.';
        }
    } catch (err) {
        errorMsg.innerText = 'Server error. Please try again later.';
    }
};
</script>

<!-- Neon Ripple Trail -->
<script src="cursor-ripple.js"></script>
</body>
</html>
