<!DOCTYPE html>
<html lang="en">
<head>
    <title>Qnario – Teacher Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

    <style>
        *{margin:0;padding:0;box-sizing:border-box;}

        body{
            font-family:'Inter',sans-serif;
            background:#0f172a;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            overflow:hidden;
            color:white;
        }

        /* ===== MASTER MESH BACKGROUND ===== */

        .bg-wrapper{
            position:fixed;
            inset:0;
            z-index:-3;
            overflow:hidden;
        }

        .gradient-mesh{
            position:absolute;
            width:140%;
            height:140%;
            background:
                radial-gradient(circle at 20% 30%, #667eea55, transparent 40%),
                radial-gradient(circle at 80% 70%, #4facfe55, transparent 40%),
                radial-gradient(circle at 50% 50%, #764ba255, transparent 40%);
            filter:blur(120px);
            animation:meshMove 20s ease-in-out infinite alternate;
        }

        @keyframes meshMove{
            0%{transform:translate(0,0) scale(1);}
            100%{transform:translate(-5%,5%) scale(1.1);}
        }

        .grid-overlay{
            position:absolute;
            inset:0;
            background-image:
                linear-gradient(rgba(255,255,255,0.05) 1px,transparent 1px),
                linear-gradient(90deg,rgba(255,255,255,0.05) 1px,transparent 1px);
            background-size:60px 60px;
        }

        /* ===== VIDEO ===== */

        #background-video{
            position:fixed;
            right:0;
            bottom:0;
            min-width:100%;
            min-height:100%;
            object-fit:cover;
            z-index:-2;
            pointer-events:none;
            opacity:0.35;
        }

        /* ===== DARK OVERLAY ===== */

        .overlay{
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.55);
            z-index:-1;
        }

        /* ===== CARD ===== */

        .card{
            width:100%;
            max-width:380px;
            padding:40px 30px;
            border-radius:24px;
            background:rgba(255,255,255,0.06);
            backdrop-filter:blur(25px);
            border:1px solid rgba(255,255,255,0.12);
            box-shadow:0 30px 80px rgba(0,0,0,0.6);
            text-align:center;
        }

        .logo{
            font-family:'Space Grotesk',sans-serif;
            font-size:2rem;
            font-weight:700;
            margin-bottom:8px;
            background:linear-gradient(135deg,#667eea,#4facfe);
            background-clip:text;
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
        }

        .subtitle{
            font-size:1rem;
            font-weight:600;
            margin-bottom:25px;
            color:rgba(255,255,255,0.8);
        }

        /* ===== INPUTS ===== */

        input{
            width:100%;
            padding:13px 15px;
            margin-bottom:16px;
            border-radius:14px;
            border:1px solid rgba(255,255,255,0.15);
            background:rgba(255,255,255,0.07);
            color:white;
            font-size:0.95rem;
            outline:none;
            transition:0.3s;
        }

        input::placeholder{
            color:rgba(255,255,255,0.5);
        }

        input:focus{
            border-color:#4facfe;
            box-shadow:0 0 0 3px rgba(79,172,254,0.2);
        }

        /* ===== BUTTON ===== */

        .login-btn{
            width:100%;
            padding:14px;
            border-radius:16px;
            border:none;
            background:linear-gradient(135deg,#667eea,#4facfe);
            font-weight:600;
            font-size:1rem;
            color:white;
            cursor:pointer;
            transition:0.3s;
            margin-top:5px;
        }

        .login-btn:hover{
            transform:translateY(-2px);
            box-shadow:0 15px 35px rgba(79,172,254,0.4);
        }

        /* ===== ERROR ===== */

        .error{
            margin-top:10px;
            min-height:22px;
            font-size:0.9rem;
            color:#f87171;
        }

        /* ===== SIGNUP LINK ===== */

        .link{
            margin-top:18px;
            font-size:0.9rem;
            color:rgba(255,255,255,0.7);
        }

        .link a{
            color:#4facfe;
            text-decoration:none;
            font-weight:600;
        }

        .link a:hover{
            text-decoration:underline;
        }

        @media(max-width:480px){
            .card{
                padding:30px 20px;
            }
        }
    </style>
</head>

<body>

<!-- MASTER BACKGROUND -->
<div class="bg-wrapper">
    <div class="gradient-mesh"></div>
    <div class="grid-overlay"></div>
</div>

<!-- VIDEO (UNCHANGED) -->
<video autoplay muted loop playsinline id="background-video">
    <source src="video/18069232-uhd_3840_2160_24fps.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="card">
    <div class="logo">Qnario</div>
    <div class="subtitle">Teacher Login</div>

    <form id="teacherLoginForm" autocomplete="off">
        <input type="email" id="email" placeholder="Email address" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit" class="login-btn">Login</button>
        <div id="errorMsg" class="error"></div>
    </form>

    <div class="link">
        Don't have an account?
        <a href="signup.html">Sign Up</a>
    </div>

    <div class="link" style="margin-top: 15px; font-size: 0.9rem;">
        <a href="forgot-password.html" style="color: #667eea;">Forgot Password?</a>
    </div>
</div>

<!-- 🔒 BACKEND SCRIPT (100% UNTOUCHED) -->
<script type="module">
import { login, isValidEmail } from './auth-utils.js';

document.getElementById('teacherLoginForm').onsubmit = async function(e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();
    const errorMsg = document.getElementById('errorMsg');
    errorMsg.innerText = '';

    if (!email || !password) {
        errorMsg.innerText = 'Please enter both email and password.';
        return;
    }
    if (!isValidEmail(email)) {
        errorMsg.innerText = 'Please enter a valid email address (gmail, hotmail, edu.in, yahoo, outlook).';
        return;
    }

    try {
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password, role: 'teacher' })
        });
        const data = await res.json();
        if (data.success) {
            localStorage.setItem('qnario_current_user', JSON.stringify(data.user));
            localStorage.setItem('qnario_token', data.token);
            window.location.href = 'teacher-dashboard.html';
        } else {
            errorMsg.innerText = data.error || 'Login failed.';
        }
    } catch (err) {
        errorMsg.innerText = 'Server error. Please try again later.';
    }
};
</script>

<!-- Neon Ripple Trail -->
<script src="cursor-ripple.js"></script>
</body>
</html>
