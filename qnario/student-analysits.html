<!DOCTYPE html>
<html lang="en">
<head>
    <title>Qnario – Student Analytics</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:600,700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Montserrat',sans-serif; background:#0f172a; color:white; overflow-x:hidden; }
        body::before {
            content:""; position:fixed; width:200%; height:200%;
            background:radial-gradient(circle at 20% 30%, #3b82f6 0%, transparent 40%),
                       radial-gradient(circle at 80% 70%, #6366f1 0%, transparent 40%);
            animation:moveBg 15s linear infinite alternate;
            z-index:-2; opacity:0.15;
        }
        @keyframes moveBg { from{transform:translate(0,0);} to{transform:translate(-10%, -10%);} }
        .container { max-width:1100px; margin:60px auto; background:rgba(255,255,255,0.05); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,0.1); border-radius:20px; padding:40px; box-shadow:0 20px 50px rgba(0,0,0,0.6); }
        h2 { text-align:center; font-size:2rem; margin-bottom:30px; background:linear-gradient(135deg,#3b82f6,#6366f1); background-clip: text; -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .tiles { display:flex; gap:20px; margin-bottom:40px; flex-wrap:wrap; justify-content:center; }
        .tile { background:rgba(59,130,246,0.1); border:1px solid rgba(59,130,246,0.3); border-radius:16px; padding:20px; flex: 1; min-width:180px; text-align:center; box-shadow:0 0 20px rgba(59,130,246,0.2); }
        .tile-val { font-size: 1.8rem; font-weight: 700; color: #60a5fa; }
        .tile-label { font-size:0.85rem; margin-top:5px; color:#c7d2fe; display: block; }
        .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 30px; margin-bottom: 40px; }
        .chart-block { background:rgba(255,255,255,0.04); border-radius:16px; padding:25px; border:1px solid rgba(255,255,255,0.1); }
        .chart-title { text-align:center; font-size:1.1rem; margin-bottom:20px; color:#a5b4fc; }
        canvas { background:#111827; border-radius:12px; width: 100% !important; height: auto !important; }
        .activity-item { background:rgba(255,255,255,0.05); border-radius:12px; margin-bottom:12px; padding:15px 20px; display:flex; justify-content:space-between; align-items:center; transition:0.3s; }
        @media(max-width:600px) { .charts { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
            <a href="student-dashboard.html" style="color:#60a5fa; text-decoration:none;">← Dashboard</a>
            <h2>Student Analytics</h2>
            <div style="width:100px;"></div>
        </div>

        <div class="tiles">
            <div class="tile">
                <div class="tile-val" id="totalExams">0</div>
                <span class="tile-label">Exams Taken</span>
            </div>
            <div class="tile">
                <div class="tile-val" id="avgScore">0%</div>
                <span class="tile-label">Average Score</span>
            </div>
            <div class="tile">
                <div class="tile-val" id="avgTime">0s</div>
                <span class="tile-label">Avg Time / Question</span>
            </div>
            <div class="tile">
                <div class="tile-val" id="totalQuestions">0</div>
                <span class="tile-label">Questions Solved</span>
            </div>
        </div>

        <div class="charts">
            <div class="chart-block">
                <div class="chart-title">Performance Trend (Scores)</div>
                <canvas id="scoreChart" width="400" height="250"></canvas>
            </div>
            <div class="chart-block">
                <div class="chart-title">Time Accuracy (Target vs Actual)</div>
                <canvas id="timeChart" width="400" height="250"></canvas>
            </div>
        </div>

        <div class="activity">
            <h3 style="margin-bottom:15px; color:#60a5fa;">Recent Exam Activity</h3>
            <div id="activityList"></div>
        </div>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem('qnario_current_user') || 'null');
        if (!user) window.location.href = 'student-login.html';

        const results = JSON.parse(localStorage.getItem('qnario_exam_results') || '[]').filter(r => r.studentEmail === user.email);

        function updateTiles() {
            document.getElementById('totalExams').innerText = results.length;
            if (results.length === 0) return;

            const totalScore = results.reduce((sum, r) => sum + r.percentage, 0);
            document.getElementById('avgScore').innerText = Math.round(totalScore / results.length) + '%';

            let totalTime = 0;
            let totalQ = 0;
            results.forEach(r => {
                totalQ += r.total;
                r.details.forEach(d => totalTime += (d.timeSeconds || 0));
            });
            document.getElementById('avgTime').innerText = totalQ > 0 ? Math.round(totalTime / totalQ) + 's' : '0s';
            document.getElementById('totalQuestions').innerText = totalQ;
        }

        function drawLineChart(canvasId, data, maxValue = 100, color = "#3b82f6") {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;
            const pad = 40;

            ctx.clearRect(0, 0, w, h);
            if (data.length < 2) {
                ctx.fillStyle = "rgba(255,255,255,0.3)";
                ctx.textAlign = "center";
                ctx.fillText("Need more data points to show trend", w/2, h/2);
                return;
            }

            ctx.strokeStyle = "rgba(255,255,255,0.1)";
            ctx.beginPath();
            ctx.moveTo(pad, pad); ctx.lineTo(pad, h - pad);
            ctx.lineTo(w - pad, h - pad);
            ctx.stroke();

            const xStep = (w - 2 * pad) / (data.length - 1);
            ctx.lineJoin = "round";
            ctx.lineWidth = 3;
            ctx.strokeStyle = color;
            ctx.beginPath();
            
            data.forEach((val, i) => {
                const x = pad + i * xStep;
                const y = h - pad - (val / maxValue) * (h - 2 * pad);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
                
                // Draw point
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.stroke();
        }

        function drawTimeAccuracyChart(canvasId, results) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;
            const pad = 40;

            ctx.clearRect(0,0,w,h);
            if(results.length === 0) return;

            const data = results.slice(-5); // Show last 5
            const barW = (w - 2 * pad) / (data.length * 2);

            data.forEach((r, i) => {
                const targetSec = (r.paperMeta.timerMinutes * 60) / r.total;
                const actualSec = r.details.reduce((sum, d) => sum + d.timeSeconds, 0) / r.total;
                const maxVal = Math.max(targetSec, actualSec, 10);

                const x = pad + i * (barW * 2 + 10);
                
                // Target Bar
                const th = (targetSec / maxVal) * (h - 2 * pad);
                ctx.fillStyle = "rgba(255, 255, 255, 0.2)";
                ctx.fillRect(x, h - pad - th, barW, th);
                
                // Actual Bar
                const ah = (actualSec / maxVal) * (h - 2 * pad);
                ctx.fillStyle = actualSec > targetSec ? "#ff6b6b" : "#4ade80";
                ctx.fillRect(x + barW, h - pad - ah, barW, ah);

                ctx.fillStyle = "rgba(255,255,255,0.5)";
                ctx.font = "10px Arial";
                ctx.fillText(`Exam ${results.indexOf(r) + 1}`, x, h - pad + 15);
            });
            
            // Legend
            ctx.fillStyle = "rgba(255,255,255,0.2)"; ctx.fillRect(w - 100, 10, 10, 10);
            ctx.fillStyle = "#fff"; ctx.fillText("Target", w - 85, 18);
            ctx.fillStyle = "#4ade80"; ctx.fillRect(w - 100, 25, 10, 10);
            ctx.fillStyle = "#fff"; ctx.fillText("Actual", w - 85, 33);
        }

        function renderActivity() {
            const list = document.getElementById('activityList');
            if (results.length === 0) {
                list.innerHTML = `<div class="activity-item">No exams taken yet.</div>`;
                return;
            }

            results.slice().reverse().forEach(r => {
                list.innerHTML += `
                    <div class="activity-item">
                        <div>
                            <strong>${r.paperMeta.subject} - ${r.paperMeta.level}</strong><br>
                            <small style="opacity:0.6">${new Date(r.takenAt).toLocaleString()}</small>
                        </div>
                        <div style="text-align:right">
                            <span style="color:${r.percentage >= 50 ? '#4ade80' : '#ff6b6b'}; font-weight:700;">${r.score}/${r.total} (${r.percentage}%)</span><br>
                            <small style="opacity:0.6">Time: ${Math.round(r.details.reduce((s,d)=>s+d.timeSeconds,0)/60)}m</small>
                        </div>
                    </div>
                `;
            });
        }

        updateTiles();
        drawLineChart('scoreChart', results.map(r => r.percentage), 100, "#3b82f6");
        drawTimeAccuracyChart('timeChart', results);
        renderActivity();
    </script>
</body>
</html>
