<!DOCTYPE html>
<html lang="en">
<head>
    <title>Qnario – AI Generated Papers</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:600,700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            background: linear-gradient(-45deg, #0f0c29, #1a1a3a, #24243e, #302b63);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
            padding: 40px 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 0 40px rgba(102,126,234,0.25);
        }

        h2 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 30px;
            background: linear-gradient(90deg, #667eea, #4facfe);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .filter-bar {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .filter-bar select {
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.08);
            color: white;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
        }

        .filter-bar select option {
            color: black;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
            border-radius: 14px;
            background: rgba(255,255,255,0.04);
        }

        th, td {
            padding: 14px 12px;
            text-align: left;
            font-size: 0.9rem;
        }

        th {
            background: rgba(255,255,255,0.08);
            font-weight: 700;
        }

        tr {
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        tr:last-child {
            border-bottom: none;
        }

        td.actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 14px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            color: white;
            transition: 0.3s ease;
        }

        .btn-preview {
            background: linear-gradient(135deg, #667eea, #4facfe);
            box-shadow: 0 0 15px rgba(79,172,254,0.4);
        }
        .btn-preview:hover { box-shadow: 0 0 25px rgba(79,172,254,0.6); transform: translateY(-2px); }

        .btn-download {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 0 15px rgba(16,185,129,0.4);
        }
        .btn-download:hover { box-shadow: 0 0 25px rgba(16,185,129,0.6); transform: translateY(-2px); }

        .btn-delete {
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            box-shadow: 0 0 15px rgba(239,68,68,0.4);
        }
        .btn-delete:hover { box-shadow: 0 0 25px rgba(239,68,68,0.6); transform: translateY(-2px); }

        .btn-answer {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            box-shadow: 0 0 15px rgba(245,158,11,0.4);
        }
        .btn-answer:hover { box-shadow: 0 0 25px rgba(245,158,11,0.6); transform: translateY(-2px); }

        /* Highlight date/time column */
        td:first-child {
            background: rgba(102, 126, 234, 0.1);
            font-weight: 600;
            color: #4facfe;
        }

        th:first-child {
            background: rgba(102, 126, 234, 0.2);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .empty-state a {
            color: #4facfe;
            font-weight: 600;
            text-decoration: none;
        }

        .empty-state a:hover {
            text-decoration: underline;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-content {
            background: #1e1e2f;
            padding: 30px;
            border-radius: 16px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }
        .close-modal {
            position: absolute;
            right: 20px;
            top: 20px;
            cursor: pointer;
            font-size: 1.5rem;
            color: #ef4444;
        }

        @media (max-width: 900px) {
            .container {
                padding: 20px;
            }

            table, thead, tbody, th, td, tr {
                display: block;
            }

            th {
                display: none;
            }

            tr {
                margin-bottom: 20px;
                padding: 14px;
                background: rgba(255,255,255,0.05);
                border-radius: 12px;
            }

            td {
                border: none;
                padding: 6px 0;
            }

            td.actions {
                margin-top: 10px;
            }
        }
    </style>
</head>

<body>

<div class="container">
    <h2>AI Generated Papers</h2>

    <div class="filter-bar" style="justify-content: center; gap: 10px; margin-bottom: 30px;">
        <a href="teacher-ai-question-generator.html" style="padding: 10px 20px; background: linear-gradient(135deg, #667eea, #4facfe); color: white; border-radius: 10px; text-decoration: none; font-weight: 600; display: inline-block;">➕ Generate New Questions</a>
        <a href="teacher-papers.html" style="padding: 10px 20px; background: rgba(255,255,255,0.1); color: white; border-radius: 10px; text-decoration: none; font-weight: 600; display: inline-block;">⬅️ Back to Papers</a>
    </div>

    <div id="tableContainer"></div>
</div>

<div class="modal" id="previewModal">
    <div class="modal-content">
        <span class="close-modal" id="closePreviewModal">&times;</span>
        <h3 style="margin-bottom: 20px; color: #4facfe;">Question Preview</h3>
        <div id="previewContent" style="line-height: 1.6;"></div>
    </div>
</div>


<script>

/* ===========================
   BACKEND LOGIC UNCHANGED
   =========================== */

function getCurrentTeacherEmail() {
    const user = JSON.parse(localStorage.getItem('qnario_current_user') || 'null');
    // if a teacher is logged in, return their email; otherwise use the same
    // fallback value that the question-generator page uses so both sides
    // read/write to the same key in localStorage.
    if (user && user.role === 'teacher') {
        return user.email;
    }
    // fallback to a dummy address so generated data is not lost when
    // the user hasn't signed in yet (mirrors generator behavior)
    return 'default_teacher@example.com';
}


function renderGeneratedQuestionsTable(generatedQuestions) {
    if (!generatedQuestions.length) {
        document.getElementById('tableContainer').innerHTML =
            `<div class="empty-state">
                No questions generated yet.<br><br>
                <a href="teacher-ai-question-generator.html">Generate Your First Questions</a>
            </div>`;
        return;
    }

    // Sort by creation date (newest first)
    const sortedQuestions = generatedQuestions.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

    let html = `<table>
        <thead>
            <tr>
                <th>Generated On (Date & Time)</th>
                <th>Subject</th>
                <th>Topic</th>
                <th>Difficulty</th>
                <th>Questions</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>`;

    sortedQuestions.forEach(item => {
        const generatedDate = new Date(item.createdAt);
        const dateTimeString = generatedDate.toLocaleDateString() + ' at ' + generatedDate.toLocaleTimeString();
        
        html += `<tr>
            <td><strong>${dateTimeString}</strong></td>
            <td>${item.subject}</td>
            <td>${item.chapter || item.topic || 'N/A'}</td>
            <td>${item.level || 'N/A'}</td>
            <td>${item.questions.length}</td>
            <td class="actions">
                <button class="btn btn-preview" onclick="previewQuestions('${item._id}')">Preview</button>
                <button class="btn btn-download" onclick="downloadQuestionsAsPDF('${item._id}')">Download</button>
                <button class="btn btn-answer" onclick="showAnswers('${item._id}')">Answers</button>
                <button class="btn btn-delete" onclick="deleteGeneratedQuestions('${item._id}')">Delete</button>
            </td>
        </tr>`;
    });

    html += `</tbody></table>`;
    document.getElementById('tableContainer').innerHTML = html;
}

// Global variable to store loaded questions
let currentGeneratedQuestions = [];

function loadAndRenderPapers() {
    const teacherEmail = getCurrentTeacherEmail();
    
    // Load AI-generated questions from API
    fetch(`/api/generated-questions/${encodeURIComponent(teacherEmail)}`)
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                currentGeneratedQuestions = data.questions;
                renderGeneratedQuestionsTable(data.questions);
            } else {
                console.error('Failed to load generated questions:', data.error);
                currentGeneratedQuestions = [];
                renderGeneratedQuestionsTable([]);
            }
        })
        .catch(error => {
            console.error('Error loading generated questions:', error);
            currentGeneratedQuestions = [];
            renderGeneratedQuestionsTable([]);
        });
}

const modal = document.getElementById('previewModal');
const previewContent = document.getElementById('previewContent');
const closePreviewModal = document.getElementById('closePreviewModal');

closePreviewModal.onclick = () => modal.style.display = "none";
window.onclick = (e) => { if(e.target == modal) modal.style.display = "none"; }

function previewQuestions(itemId) {
    const item = currentGeneratedQuestions.find(q => q._id === itemId);
    if (!item) return;

    let html = `
        <div style="margin-bottom: 20px; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 8px;">
            <strong>Level:</strong> ${item.level} | <strong>Subject:</strong> ${item.subject} <br>
            <strong>Chapter/Topic:</strong> ${item.chapter || item.topic || 'N/A'}
        </div>
    `;

    item.questions.forEach((q, idx) => {
        const cleanText = q.text ? q.text.replace(/\\n/g, '<br>').replace(/\*\*/g, '') : '';
        html += `
            <div style="margin-bottom: 20px; padding-left: 10px; border-left: 2px solid rgba(255,255,255,0.2);">
                <strong style="color:#4facfe;">${idx+1}.</strong> ${cleanText}
        `;
        
        if (q.options && q.options.length > 0) {
            html += `<ul style="list-style-type: none; padding-left: 20px; margin-top: 10px;">`;
            q.options.forEach((opt, i) => {
                const optText = typeof opt === 'string' ? opt : opt.text;
                html += `<li style="margin-bottom: 5px;">${opt.id || String.fromCharCode(65 + i)}) ${optText}</li>`;
            });
            html += `</ul>`;
        }
        
        if (q.answer) {
            html += `
                <div style="margin-top: 10px; padding: 10px; background: rgba(16, 185, 129, 0.1); border-radius: 6px;">
                    <strong>Ans:</strong> ${q.answer.correctOption || 'N/A'}<br>
                    <span style="opacity:0.8; font-size: 0.9em;"><strong>Exp:</strong> ${q.answer.explanation || 'No explanation'}</span>
                </div>
            `;
        }
        
        html += `</div>`;
    });

    previewContent.innerHTML = html;
    modal.style.display = "flex";
}

function showAnswers(itemId) {
    const item = currentGeneratedQuestions.find(q => q._id === itemId);
    if (!item) return;

    let html = `<h3 style="margin-bottom: 16px; color:#4facfe;">Correct Answers for ${item.subject} / ${item.chapter || item.topic}</h3>`;

    item.questions.forEach((q, idx) => {
        const text = q.text ? q.text.replace(/\n/g, '<br>') : '';
        let answerLine = 'No answer provided';

        if (q.correctAnswer) {
            answerLine = q.correctAnswer;
        } else if (q.correctAnswers) {
            answerLine = q.correctAnswers;
        } else if (q.answer) {
            answerLine = q.answer.correctOption || q.answer || 'N/A';
        } else if (q.detailedAnswer) {
            answerLine = q.detailedAnswer;
        }

        html += `
            <div style="margin-bottom: 14px; padding: 12px; background: rgba(255,255,255,0.05); border-radius: 10px;">
                <strong>${idx+1}.</strong> ${text}<br>
                <span style="color:#facc15;">Answer:</span> ${answerLine}
            </div>
        `;
    });

    previewContent.innerHTML = html;
    modal.style.display = "flex";
}


function downloadQuestionsAsPDF(itemId) {
    const item = currentGeneratedQuestions.find(q => q._id === itemId);
    if (!item) return;
    
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'pt', format: 'a4' });
    let y = 48;
    
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(20);
    doc.text(`${item.subject} - ${item.chapter || item.topic || 'Questions'}`, 40, y);
    
    doc.setFontSize(12);
    doc.setFont('helvetica', 'normal');
    y += 24;
    doc.text(`Date: ${new Date(item.createdAt).toLocaleDateString()}`, 40, y);
    y += 18;
    doc.text(`Level: ${item.level} | Questions: ${item.questions.length}`, 40, y);
    y += 28;

    item.questions.forEach((q, idx) => {
        if (y > 760) { doc.addPage(); y = 48; }
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(13);
        const cleanText = q.text ? q.text.replace(/\\n/g, ' ').replace(/\*\*/g, '') : '';
        const lines = doc.splitTextToSize(`${idx + 1}. ${cleanText}`, 500);
        doc.text(lines, 40, y);
        y += lines.length * 16;
        
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(12);
        
        if (q.options && q.options.length > 0) {
            q.options.forEach((opt, i) => {
                const optText = typeof opt === 'string' ? opt : opt.text;
                doc.text(`   ${opt.id || String.fromCharCode(65 + i)}) ${optText}`, 60, y);
                y += 16;
            });
        }
        
        if (q.answer) {
            y += 8;
            doc.setFont('helvetica', 'bold');
            doc.text(`Answer: ${q.answer.correctOption}`, 60, y);
            y += 16;
            doc.setFont('helvetica', 'normal');
            const explanation = q.answer.explanation || 'No explanation';
            const expLines = doc.splitTextToSize(explanation, 450);
            doc.text(expLines, 60, y);
            y += expLines.length * 16;
        }
        
        y += 8;
    });

    doc.save(`${item.subject}_${item.chapter || item.topic}_${new Date().getTime()}.pdf`);
}

function deleteGeneratedQuestions(itemId) {
    if (!confirm('Are you sure you want to delete this generated question set?')) return;

    fetch(`/api/generated-questions/${itemId}`, {
        method: 'DELETE'
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            alert('Question set deleted successfully!');
            loadAndRenderPapers(); 
        } else {
            alert('Failed to delete question set: ' + data.error);
        }
    })
    .catch(error => {
        console.error('Error deleting question set:', error);
        alert('Error deleting question set. Please try again.');
    });
}

// perform initial render
loadAndRenderPapers();

</script>

</body>
</html>
