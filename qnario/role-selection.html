<!DOCTYPE html>
<html lang="en">
<head>
    <title>QNARIO – Choose Your Role</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Space+Grotesk:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles-global.css">

    <style>
        *{margin:0;padding:0;box-sizing:border-box}

        body{
            font-family:'Inter',sans-serif;
            background:#0a0e27;
            color:white;
            overflow:hidden;
        }

        /* ================= BACKGROUND ================= */

        .bg-wrapper{
            position:fixed;
            inset:0;
            z-index:-2;
            overflow:hidden;
        }

        .gradient-mesh{
            position:absolute;
            width:200%;
            height:200%;
            background:
                radial-gradient(circle at 20% 30%, #667eea 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, #764ba2 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, #4facfe 0%, transparent 40%);
            animation:moveMesh 20s infinite alternate ease-in-out;
            filter:blur(120px);
            opacity:0.7;
        }

        @keyframes moveMesh{
            0%{transform:translate(-10%,-10%)}
            100%{transform:translate(10%,10%)}
        }

        .grid-overlay{
            position:absolute;
            inset:0;
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size:40px 40px;
        }

        /* Floating glow orbs */
        .glow-orb{
            position:absolute;
            width:300px;
            height:300px;
            border-radius:50%;
            background:radial-gradient(circle,#667eea,transparent 70%);
            filter:blur(120px);
            opacity:0.3;
            animation:floatOrb 18s infinite alternate ease-in-out;
        }

        .orb2{
            top:60%;
            left:70%;
            background:radial-gradient(circle,#764ba2,transparent 70%);
            animation-duration:22s;
        }

        @keyframes floatOrb{
            0%{transform:translate(-50px,-50px)}
            100%{transform:translate(50px,50px)}
        }

        /* ================= NAVBAR ================= */

        nav{
            position:fixed;
            width:100%;
            padding:20px 60px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            backdrop-filter:blur(20px);
            background:rgba(0,0,0,0.3);
            z-index:10;
        }

        .logo{
            font-family:'Space Grotesk',sans-serif;
            font-weight:800;
            font-size:1.5rem;
            background:linear-gradient(135deg,#667eea,#4facfe);
            background-clip:text;
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
            cursor:pointer;
        }

        .nav-btn{
            padding:10px 25px;
            border-radius:8px;
            border:1px solid rgba(255,255,255,0.2);
            background:transparent;
            color:white;
            cursor:pointer;
        }

        /* ================= MAIN ================= */

        .main-section{
            min-height:100vh;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            padding:120px 20px;
            text-align:center;
            animation:fadeInPage 1s ease forwards;
        }

        @keyframes fadeInPage{
            from{opacity:0; transform:translateY(20px);}
            to{opacity:1; transform:translateY(0);}
        }

        .main-section h1{
            font-family:'Space Grotesk',sans-serif;
            font-size:3rem;
            margin-bottom:50px;
            background:linear-gradient(135deg,#667eea,#f5576c,#4facfe);
            background-clip:text;
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
        }

        /* ================= ROLE CARDS ================= */

        .role-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
            gap:40px;
            max-width:1000px;
            width:100%;
        }

        .role-card{
            position:relative;
            background:rgba(255,255,255,0.05);
            backdrop-filter:blur(20px);
            border:1px solid rgba(255,255,255,0.1);
            padding:50px 30px;
            border-radius:20px;
            cursor:pointer;
            transition:0.4s;
            overflow:hidden;
        }

        /* animated glow behind card */
        .role-card::before{
            content:"";
            position:absolute;
            width:200%;
            height:200%;
            background:radial-gradient(circle,#667eea,transparent 60%);
            top:-50%;
            left:-50%;
            opacity:0;
            transition:0.5s;
        }

        .role-card:hover::before{
            opacity:0.15;
        }

        .role-card:hover{
            transform:translateY(-12px);
            border:1px solid rgba(102,126,234,0.6);
            box-shadow:0 20px 40px rgba(0,0,0,0.5);
        }

        .role-icon{
            font-size:3.5rem;
            margin-bottom:20px;
        }

        .role-title{
            font-size:1.5rem;
            font-weight:700;
            margin-bottom:10px;
        }

        .role-subtitle{
            opacity:0.7;
        }

        /* ================= PAGE TRANSITION ================= */

        .fade-out{
            animation:fadeOutPage 0.6s ease forwards;
        }

        @keyframes fadeOutPage{
            from{opacity:1;}
            to{opacity:0; transform:scale(0.98);}
        }

        /* ================= FLOATING & FALLING ELEMENTS ================= */

        #particles-canvas{
            position:fixed;
            inset:0;
            z-index:0;
        }

        .floating-letters{
            position:fixed;
            inset:0;
            z-index:0;
            pointer-events:none;
        }

        .floating-letters span{
            position:absolute;
            opacity:0.15;
            font-weight:800;
            font-family:'Space Grotesk',sans-serif;
            white-space:nowrap;
            animation:float-up 15s linear forwards;
        }

        @keyframes float-up{
            from{
                opacity:0.15;
                transform:translateY(100vh) rotate(0deg);
            }
            to{
                opacity:0;
                transform:translateY(-100vh) rotate(360deg);
            }
        }

        .falling-books{
            position:fixed;
            inset:0;
            z-index:0;
            pointer-events:none;
        }

        .falling-books span{
            position:absolute;
            animation:fall-down 12s linear forwards;
        }

        @keyframes fall-down{
            from{
                opacity:1;
                transform:translateY(-100vh) rotate(0deg);
            }
            to{
                opacity:0;
                transform:translateY(100vh) rotate(360deg);
            }
        }

    </style>
</head>

<body>

<canvas id="particles-canvas"></canvas>
<div class="floating-letters"></div>
<div class="falling-books"></div>

<div class="bg-wrapper">
    <div class="gradient-mesh"></div>
    <div class="grid-overlay"></div>
    <div class="glow-orb"></div>
    <div class="glow-orb orb2"></div>
</div>

<nav>
    <div class="logo" onclick="goHome()">QNARIO</div>
    <button class="nav-btn" onclick="goHome()">Home</button>
</nav>

<div class="main-section">
    <div class="brand-header">

        <div class="logo-container">
            <div class="logo-outer"></div>
            <div class="logo-inner">Q</div>
        </div>

        <h1 class="brand-title">QNARIO</h1>
        <p class="brand-subtitle">
            Intelligent Question Paper Generation System
        </p>

    </div>
    
    <div class="role-grid">
        <div class="role-card" onclick="navigateTo('teacher-login.html')">
            <div class="role-icon">👨‍🏫</div>
            <div class="role-title">Teacher</div>
            <div class="role-subtitle">Create and manage question papers</div>
        </div>

        <div class="role-card" onclick="navigateTo('student-login.html')">
            <div class="role-icon">🎓</div>
            <div class="role-title">Student</div>
            <div class="role-subtitle">Attempt exams and view performance</div>
        </div>

        <div class="role-card" onclick="navigateTo('admin-login.html')">
            <div class="role-icon">⚙️</div>
            <div class="role-title">Admin</div>
            <div class="role-subtitle">View all user details & manage system</div>
        </div>
    </div>
</div>

<script>
function goHome(){
    navigateTo("landing.html");
}

function navigateTo(url){
    const main = document.querySelector(".main-section");
    main.classList.add("fade-out");
    setTimeout(()=>{
        window.location.href = url;
    },600);
}

// Floating Letters
const lettersContainer = document.querySelector('.floating-letters');
const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

function createLetter() {
    const span = document.createElement("span");
    span.textContent = letters[Math.floor(Math.random() * letters.length)];
    span.style.left = Math.random() * 100 + "vw";
    span.style.fontSize = (12 + Math.random() * 30) + "px";
    lettersContainer.appendChild(span);
    setTimeout(() => span.remove(), 15000);
}
setInterval(createLetter, 400);

// Falling Books
const booksContainer = document.querySelector('.falling-books');
const books = ["📘","📒","📕","📚","✏️","🖊️"];

function createBook() {
    const span = document.createElement("span");
    span.textContent = books[Math.floor(Math.random() * books.length)];
    span.style.left = Math.random() * 100 + "vw";
    span.style.fontSize = (18 + Math.random() * 20) + "px";
    booksContainer.appendChild(span);
    setTimeout(() => span.remove(), 12000);
}
setInterval(createBook, 1000);
</script>

<!-- Neon Ripple Trail -->
<script src="cursor-ripple.js"></script>
</body>
</html>
