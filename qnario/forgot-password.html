<!DOCTYPE html>
<html lang="en">
<head>
    <title>Forgot Password - QNARIO</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Space+Grotesk:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles-global.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0e27;
            color: white;
            overflow: hidden;
        }

        .bg-wrapper {
            position: fixed;
            inset: 0;
            z-index: -2;
            overflow: hidden;
        }

        .gradient-mesh {
            position: absolute;
            width: 200%;
            height: 200%;
            background:
                radial-gradient(circle at 20% 30%, #667eea 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, #764ba2 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, #4facfe 0%, transparent 40%);
            animation: moveMesh 20s infinite alternate ease-in-out;
            filter: blur(120px);
            opacity: 0.7;
        }

        @keyframes moveMesh {
            0% { transform: translate(-10%, -10%); }
            100% { transform: translate(10%, 10%); }
        }

        .grid-overlay {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        nav {
            position: fixed;
            width: 100%;
            padding: 20px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(20px);
            background: rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 800;
            font-size: 1.5rem;
            background: linear-gradient(135deg, #667eea, #4facfe);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
        }

        .nav-btn {
            padding: 10px 25px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: transparent;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        .nav-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px 20px;
        }

        .forgot-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 50px 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 450px;
            animation: fadeInBox 0.6s ease forwards;
        }

        @keyframes fadeInBox {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .forgot-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea, #f5576c);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .forgot-subtitle {
            opacity: 0.7;
            margin-bottom: 30px;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.1);
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .forgot-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.4s;
            margin-top: 30px;
        }

        .forgot-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
        }

        .forgot-btn:active {
            transform: translateY(-1px);
        }

        .forgot-btn.loading {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .error-message {
            display: none;
            background: rgba(245, 87, 108, 0.1);
            border: 1px solid #f5576c;
            color: #ff6b9d;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .error-message.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        .success-message {
            display: none;
            background: rgba(79, 172, 254, 0.1);
            border: 1px solid #4facfe;
            color: #4facfe;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .success-message.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .back-link {
            text-align: center;
            margin-top: 25px;
            font-size: 0.9rem;
        }

        .back-link a {
            color: #667eea;
            text-decoration: none;
            cursor: pointer;
            transition: 0.3s;
        }

        .back-link a:hover {
            color: #4facfe;
        }
    </style>
</head>

<body>
<div class="bg-wrapper">
    <div class="gradient-mesh"></div>
    <div class="grid-overlay"></div>
</div>

<nav>
    <div class="logo" onclick="goHome()">QNARIO</div>
    <button class="nav-btn" onclick="goHome()">Back</button>
</nav>

<div class="container">
    <div class="forgot-box">
        <h1 class="forgot-title">🔑 Forgot Password?</h1>
        <p class="forgot-subtitle">Enter your email address and we'll send you a link to reset your password.</p>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <form id="forgotForm" onsubmit="handleForgot(event)">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="your@email.com" required>
            </div>

            <button type="submit" class="forgot-btn" id="forgotBtn">Send Reset Link</button>
        </form>

        <div class="back-link">
            <a onclick="goHome()">← Back to Home</a>
        </div>
    </div>
</div>

<script>
    function goHome() {
        window.location.href = 'role-selection.html';
    }

    async function handleForgot(event) {
        event.preventDefault();
        
        const email = document.getElementById('email').value;
        const forgotBtn = document.getElementById('forgotBtn');
        const errorMsg = document.getElementById('errorMessage');
        const successMsg = document.getElementById('successMessage');

        // Clear messages
        errorMsg.classList.remove('show');
        successMsg.classList.remove('show');

        forgotBtn.classList.add('loading');
        forgotBtn.textContent = 'Sending...';

        try {
            const response = await fetch('/api/auth/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });

            const data = await response.json();

            if (!response.ok) {
                errorMsg.textContent = data.message || 'Request failed';
                errorMsg.classList.add('show');
                forgotBtn.classList.remove('loading');
                forgotBtn.textContent = 'Send Reset Link';
                return;
            }

            // Success
            successMsg.textContent = data.message;
            successMsg.classList.add('show');
            document.getElementById('forgotForm').reset();
            forgotBtn.classList.remove('loading');
            forgotBtn.textContent = 'Send Reset Link';

            // Clear after 3 seconds
            setTimeout(() => {
                successMsg.classList.remove('show');
            }, 5000);
        } catch (error) {
            console.error('Error:', error);
            errorMsg.textContent = 'Connection error. Please try again.';
            errorMsg.classList.add('show');
            forgotBtn.classList.remove('loading');
            forgotBtn.textContent = 'Send Reset Link';
        }
    }
</script>

<script src="cursor-ripple.js"></script>
</body>
</html>
