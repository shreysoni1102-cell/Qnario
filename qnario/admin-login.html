<!DOCTYPE html>
<html lang="en">
<head>
    <title>Admin Login - QNARIO</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Space+Grotesk:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles-global.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0e27;
            color: white;
            overflow: hidden;
        }

        .bg-wrapper {
            position: fixed;
            inset: 0;
            z-index: -2;
            overflow: hidden;
        }

        .gradient-mesh {
            position: absolute;
            width: 200%;
            height: 200%;
            background:
                radial-gradient(circle at 20% 30%, #667eea 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, #764ba2 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, #4facfe 0%, transparent 40%);
            animation: moveMesh 20s infinite alternate ease-in-out;
            filter: blur(120px);
            opacity: 0.7;
        }

        @keyframes moveMesh {
            0% { transform: translate(-10%, -10%); }
            100% { transform: translate(10%, 10%); }
        }

        .grid-overlay {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .glow-orb {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, #667eea, transparent 70%);
            filter: blur(120px);
            opacity: 0.3;
            animation: floatOrb 18s infinite alternate ease-in-out;
        }

        .orb2 {
            top: 60%;
            left: 70%;
            background: radial-gradient(circle, #764ba2, transparent 70%);
            animation-duration: 22s;
        }

        @keyframes floatOrb {
            0% { transform: translate(-50px, -50px); }
            100% { transform: translate(50px, 50px); }
        }

        nav {
            position: fixed;
            width: 100%;
            padding: 20px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(20px);
            background: rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 800;
            font-size: 1.5rem;
            background: linear-gradient(135deg, #667eea, #4facfe);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
        }

        .nav-btn {
            padding: 10px 25px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: transparent;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        .nav-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px 20px;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 50px 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 450px;
            animation: fadeInBox 0.6s ease forwards;
        }

        @keyframes fadeInBox {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea, #f5576c);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-subtitle {
            opacity: 0.7;
            margin-bottom: 40px;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.1);
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.4s;
            margin-top: 30px;
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
        }

        .login-btn:active {
            transform: translateY(-1px);
        }

        .login-btn.loading {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .error-message {
            display: none;
            background: rgba(245, 87, 108, 0.1);
            border: 1px solid #f5576c;
            color: #ff6b9d;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .error-message.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .back-link {
            text-align: center;
            margin-top: 25px;
            font-size: 0.9rem;
        }

        .back-link a {
            color: #667eea;
            text-decoration: none;
            cursor: pointer;
            transition: 0.3s;
        }

        .back-link a:hover {
            color: #4facfe;
        }
    </style>
</head>

<body>
<div class="bg-wrapper">
    <div class="gradient-mesh"></div>
    <div class="grid-overlay"></div>
    <div class="glow-orb"></div>
    <div class="glow-orb orb2"></div>
</div>

<nav>
    <div class="logo" onclick="goHome()">QNARIO</div>
    <button class="nav-btn" onclick="goHome()">Back</button>
</nav>

<div class="login-container">
    <div class="login-box">
        <h1 class="login-title">⚙️ Admin Panel</h1>
        <p class="login-subtitle">Manage your system securely</p>

        <div id="errorMessage" class="error-message"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">Admin Email</label>
                <input type="email" id="email" name="email" placeholder="admin@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">Login as Admin</button>
        </form>

        <div class="back-link">
            <a onclick="goHome()">← Back to Role Selection</a>
            <br style="margin: 10px 0;">
            <a href="forgot-password.html" style="color: #667eea;">Forgot Password?</a>
        </div>
    </div>
</div>

<script>
    function goHome() {
        window.location.href = 'role-selection.html';
    }

    async function handleLogin(event) {
        event.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const loginBtn = document.getElementById('loginBtn');
        const errorMsg = document.getElementById('errorMessage');

        loginBtn.classList.add('loading');
        loginBtn.textContent = 'Logging in...';

        try {
            const response = await fetch('/api/auth/admin-login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (!response.ok) {
                errorMsg.textContent = data.message || 'Login failed';
                errorMsg.classList.add('show');
                loginBtn.classList.remove('loading');
                loginBtn.textContent = 'Login as Admin';
                return;
            }

            // Store token
            localStorage.setItem('adminToken', data.token);
            localStorage.setItem('adminUser', JSON.stringify(data.user));

            // Redirect to admin dashboard
            setTimeout(() => {
                window.location.href = 'admin-dashboard.html';
            }, 500);
        } catch (error) {
            console.error('Error:', error);
            errorMsg.textContent = 'Connection error. Please try again.';
            errorMsg.classList.add('show');
            loginBtn.classList.remove('loading');
            loginBtn.textContent = 'Login as Admin';
        }
    }
</script>

<script src="cursor-ripple.js"></script>
</body>
</html>
