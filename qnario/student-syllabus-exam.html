<!DOCTYPE html>
<html lang="en">
<head>
    <title>QNARIO – Join Exam</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;800&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Inter',sans-serif;background:#0a0e27;color:#fff;min-height:100vh;}
        .bg-wrapper{position:fixed;inset:0;z-index:-1;overflow:hidden;}
        .gradient-mesh{position:absolute;width:200%;height:200%;background:radial-gradient(circle at 20% 30%,#667eea 0%,transparent 40%),radial-gradient(circle at 80% 70%,#764ba2 0%,transparent 40%);animation:moveMesh 20s infinite alternate;filter:blur(120px);opacity:0.5;}
        .grid-overlay{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.03) 1px,transparent 1px);background-size:40px 40px;}
        @keyframes moveMesh{0%{transform:translate(-10%,-10%)}100%{transform:translate(10%,10%)}}

        /* TOPBAR */
        .topbar{position:fixed;top:0;width:100%;height:64px;display:flex;justify-content:space-between;align-items:center;padding:0 30px;backdrop-filter:blur(20px);background:rgba(0,0,0,0.4);z-index:200;border-bottom:1px solid rgba(255,255,255,0.07);}
        .logo{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:1.4rem;background:linear-gradient(135deg,#667eea,#4facfe);background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
        .timer-display{font-family:'Space Grotesk',sans-serif;font-size:1.5rem;font-weight:800;padding:6px 20px;border-radius:10px;background:rgba(0,0,0,0.4);border:2px solid rgba(102,126,234,0.4);letter-spacing:2px;display:none;}
        .timer-display.warning{border-color:rgba(245,158,11,0.7);color:#fcd34d;animation:pulse 1s infinite;}
        .timer-display.danger{border-color:rgba(239,68,68,0.8);color:#fca5a5;animation:pulse 0.5s infinite;}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}

        .page{padding:84px 24px 80px;max-width:860px;margin:0 auto;}

        /* JOIN PANEL */
        .glass{background:rgba(255,255,255,0.05);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:40px;}
        .join-icon{font-size:3rem;text-align:center;margin-bottom:16px;}
        .join-title{text-align:center;font-family:'Space Grotesk',sans-serif;font-size:2rem;font-weight:800;background:linear-gradient(135deg,#a78bfa,#4facfe);background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;}
        .join-sub{text-align:center;color:rgba(255,255,255,0.5);margin-bottom:32px;}
        .field{margin-bottom:18px;}
        .field label{display:block;font-size:0.78rem;font-weight:700;letter-spacing:1px;color:rgba(255,255,255,0.5);margin-bottom:7px;}
        .field input{width:100%;padding:13px 16px;border-radius:12px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.07);color:#fff;font-size:1rem;outline:none;transition:0.2s;font-family:'Inter',sans-serif;}
        .field input:focus{border-color:#667eea;background:rgba(102,126,234,0.1);}
        .field input.code-input{font-size:1.6rem;font-weight:800;text-align:center;letter-spacing:6px;font-family:'Space Grotesk',sans-serif;text-transform:uppercase;}
        .btn{width:100%;padding:14px;border-radius:12px;border:none;font-size:1rem;font-weight:700;cursor:pointer;transition:0.25s;display:flex;align-items:center;justify-content:center;gap:8px;}
        .btn-primary{background:linear-gradient(135deg,#667eea,#4facfe);color:#fff;}
        .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(102,126,234,0.4);}
        .btn-primary:disabled{opacity:0.5;cursor:not-allowed;transform:none;}

        /* WAITING ROOM */
        .waiting-room{text-align:center;padding:20px 0;}
        .waiting-room h2{font-size:1.5rem;font-weight:800;margin-bottom:8px;}
        .waiting-pulse{width:80px;height:80px;border-radius:50%;background:rgba(102,126,234,0.2);border:3px solid #667eea;display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 20px;animation:waitPulse 2s infinite;}
        @keyframes waitPulse{0%,100%{box-shadow:0 0 0 0 rgba(102,126,234,0.4)}50%{box-shadow:0 0 0 20px rgba(102,126,234,0)}}
        .info-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 18px;border-radius:20px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);font-size:0.9rem;margin:6px;}

        /* EXAM INTERFACE */
        .exam-header{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:16px 24px;margin-bottom:24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
        .exam-subject{font-weight:700;font-size:1.1rem;}
        .progress-bar-wrap{flex:1;max-width:300px;background:rgba(255,255,255,0.08);border-radius:20px;height:8px;overflow:hidden;}
        .progress-bar-fill{height:100%;background:linear-gradient(90deg,#667eea,#4facfe);border-radius:20px;transition:width 0.4s;}

        .q-nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px;}
        .q-nav-btn{width:38px;height:38px;border-radius:8px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.6);font-size:0.85rem;font-weight:600;cursor:pointer;transition:0.2s;}
        .q-nav-btn.answered{background:rgba(16,185,129,0.2);border-color:rgba(16,185,129,0.5);color:#6ee7b7;}
        .q-nav-btn.current{background:rgba(102,126,234,0.3);border-color:#667eea;color:#fff;}

        .question-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.09);border-radius:18px;padding:28px;margin-bottom:20px;}
        .q-info{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
        .q-badge{padding:3px 10px;border-radius:20px;font-size:0.72rem;font-weight:700;}
        .badge-ch{background:rgba(167,139,250,0.18);color:#c4b5fd;border:1px solid rgba(167,139,250,0.3);}
        .badge-marks{background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.8);}
        .badge-type{background:rgba(79,172,254,0.15);color:#7dd3fc;border:1px solid rgba(79,172,254,0.3);}
        .q-text{font-size:1.05rem;font-weight:600;line-height:1.6;margin-bottom:20px;}
        .options-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
        .option-btn{padding:12px 16px;border-radius:12px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.85);font-size:0.92rem;cursor:pointer;transition:0.2s;text-align:left;}
        .option-btn:hover{border-color:rgba(102,126,234,0.5);background:rgba(102,126,234,0.1);}
        .option-btn.selected{border-color:#667eea;background:rgba(102,126,234,0.25);color:#fff;font-weight:600;}
        .short-answer{width:100%;padding:12px 16px;border-radius:12px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.07);color:#fff;font-size:0.95rem;outline:none;resize:vertical;min-height:100px;font-family:'Inter',sans-serif;}
        .short-answer:focus{border-color:#667eea;}

        .q-footer{display:flex;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap;gap:10px;}
        .nav-btns{display:flex;gap:10px;}
        .btn-sm{padding:10px 20px;border-radius:10px;border:none;font-size:0.88rem;font-weight:600;cursor:pointer;transition:0.2s;}
        .btn-outline{background:rgba(255,255,255,0.07);color:#fff;border:1px solid rgba(255,255,255,0.15);}
        .btn-outline:hover{background:rgba(255,255,255,0.12);}
        .btn-green{background:linear-gradient(135deg,#10b981,#34d399);color:#fff;}
        .btn-green:hover{transform:translateY(-2px);}
        .btn-submit{background:linear-gradient(135deg,#a78bfa,#667eea);color:#fff;padding:10px 24px;border-radius:10px;border:none;font-size:0.95rem;font-weight:700;cursor:pointer;}

        /* DOUBT CHAT */
        .doubt-panel{position:fixed;bottom:20px;right:20px;width:320px;background:rgba(10,14,39,0.95);border:1px solid rgba(102,126,234,0.3);border-radius:16px;backdrop-filter:blur(20px);z-index:300;display:none;}
        .doubt-panel.open{display:block;}
        .doubt-header{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,0.08);}
        .doubt-header span{font-weight:700;font-size:0.95rem;}
        .doubt-messages{height:200px;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;}
        .doubt-msg{padding:8px 12px;border-radius:10px;font-size:0.83rem;max-width:85%;}
        .doubt-msg.sent{background:rgba(102,126,234,0.25);border:1px solid rgba(102,126,234,0.3);align-self:flex-end;}
        .doubt-msg.received{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);align-self:flex-start;}
        .doubt-input-row{padding:10px;display:flex;gap:8px;border-top:1px solid rgba(255,255,255,0.08);}
        .doubt-input-row input{flex:1;padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.07);color:#fff;font-size:0.85rem;outline:none;}
        .doubt-send{padding:8px 14px;border-radius:8px;border:none;background:linear-gradient(135deg,#667eea,#4facfe);color:#fff;font-weight:700;cursor:pointer;font-size:0.85rem;}
        .float-doubt-btn{position:fixed;bottom:20px;right:20px;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#667eea,#a78bfa);border:none;color:#fff;font-size:1.4rem;cursor:pointer;z-index:295;box-shadow:0 4px 20px rgba(102,126,234,0.4);display:none;}

        .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:12px;font-weight:600;font-size:0.9rem;z-index:999;display:none;}
        .toast.show{display:block;}
        .toast.info{background:rgba(102,126,234,0.9);color:#fff;}
        .toast.warn{background:rgba(245,158,11,0.9);color:#fff;}
        .toast.success{background:rgba(16,185,129,0.9);color:#fff;}

        @media(max-width:600px){.options-grid{grid-template-columns:1fr;}.page{padding:80px 14px 80px;}}
    </style>
</head>
<body>
<div class="bg-wrapper"><div class="gradient-mesh"></div><div class="grid-overlay"></div></div>

<div class="topbar">
    <div class="logo">QNARIO</div>
    <div class="timer-display" id="timerDisplay">00:00:00</div>
    <div id="topbarInfo" style="font-size:0.85rem;color:rgba(255,255,255,0.5);"></div>
</div>

<div class="page">

    <!-- JOIN PANEL -->
    <div id="joinPanel">
        <div class="glass">
            <div class="join-icon">🎓</div>
            <div class="join-title">Join Exam</div>
            <div class="join-sub">Enter the room code provided by your teacher</div>
            <div class="field"><label>EXAM ROOM CODE</label><input type="text" id="roomCode" class="code-input" placeholder="ABC123" maxlength="6"></div>
            <div class="field"><label>YOUR NAME</label><input type="text" id="studentName" placeholder="Enter your full name"></div>
            <div class="field"><label>YOUR EMAIL</label><input type="email" id="studentEmail" placeholder="your@email.com"></div>
            <button class="btn btn-primary" id="joinBtn" onclick="joinExam()">🚀 Join Exam</button>
        </div>
    </div>

    <!-- WAITING ROOM -->
    <div id="waitingPanel" style="display:none;">
        <div class="glass">
            <div class="waiting-room">
                <div class="waiting-pulse">⏳</div>
                <h2 id="waitSubject">Waiting for Exam to Start</h2>
                <p style="color:rgba(255,255,255,0.5);margin-bottom:20px;">Your teacher will start the exam shortly. Please wait.</p>
                <div>
                    <span class="info-badge" id="waitRoom">Room: ---</span>
                    <span class="info-badge" id="waitDuration">Duration: ---</span>
                    <span class="info-badge" id="waitStudents">Students: 0</span>
                </div>
            </div>
        </div>
    </div>

    <!-- EXAM PANEL -->
    <div id="examPanel" style="display:none;">
        <div class="exam-header">
            <div>
                <div class="exam-subject" id="examSubject"></div>
                <div style="font-size:0.8rem;color:rgba(255,255,255,0.5);margin-top:2px;" id="examClass"></div>
            </div>
            <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
                <div>
                    <div style="font-size:0.72rem;color:rgba(255,255,255,0.4);margin-bottom:4px;">PROGRESS</div>
                    <div style="display:flex;align-items:center;gap:10px;">
                        <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>
                        <span id="progressText" style="font-size:0.85rem;font-weight:700;">0%</span>
                    </div>
                </div>
                <button class="btn-submit" onclick="confirmSubmit()">Submit Paper</button>
            </div>
        </div>

        <div class="q-nav" id="qNav"></div>
        <div id="questionArea"></div>
    </div>

</div>

<!-- DOUBT CHAT BUTTON -->
<button class="float-doubt-btn" id="floatDoubtBtn" onclick="toggleDoubt()">💬</button>

<!-- DOUBT PANEL -->
<div class="doubt-panel" id="doubtPanel">
    <div class="doubt-header">
        <span>💬 Ask Teacher</span>
        <button onclick="toggleDoubt()" style="background:none;border:none;color:rgba(255,255,255,0.6);cursor:pointer;font-size:1.1rem;">✕</button>
    </div>
    <div class="doubt-messages" id="doubtMessages"></div>
    <div class="doubt-input-row">
        <input type="text" id="doubtInput" placeholder="Type your doubt..." onkeydown="if(event.key==='Enter')sendDoubt()">
        <button class="doubt-send" onclick="sendDoubt()">Send</button>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
const socket = io();
let roomCode = '', studentName = '', studentEmail = '';
let paper = null, answers = {}, currentQ = 0, timer = null, totalSecs = 0;

// ── JOIN ──────────────────────────────────────────────────
async function joinExam() {
    roomCode = document.getElementById('roomCode').value.trim().toUpperCase();
    studentName = document.getElementById('studentName').value.trim();
    studentEmail = document.getElementById('studentEmail').value.trim();
    if (!roomCode || !studentName || !studentEmail) { showToast('Fill all fields', 'warn'); return; }

    const btn = document.getElementById('joinBtn');
    btn.disabled = true; btn.innerHTML = '⏳ Joining...';

    try {
        const info = await fetch(`/api/exam-room/${roomCode}`).then(r => r.json());
        if (!info.success) { showToast('Invalid room code', 'warn'); btn.disabled=false; btn.innerHTML='🚀 Join Exam'; return; }

        // Fetch paper
        const pData = await fetch(`/api/exam-room/${roomCode}/paper`).then(r => r.json());
        if (!pData.success) { showToast('Could not load paper', 'warn'); btn.disabled=false; btn.innerHTML='🚀 Join Exam'; return; }
        paper = pData.paper;
        totalSecs = (pData.duration || 180) * 60;

        // Socket join
        socket.emit('student_join', { roomCode, studentName, studentEmail });

        document.getElementById('joinPanel').style.display = 'none';
        document.getElementById('waitingPanel').style.display = 'block';
        document.getElementById('waitSubject').textContent = paper.subject || 'Exam';
        document.getElementById('waitRoom').textContent = 'Room: ' + roomCode;
        document.getElementById('waitDuration').textContent = 'Duration: ' + pData.duration + ' mins';
        document.getElementById('topbarInfo').textContent = studentName;

        // If already started, start immediately
        if (info.started) startExam();
    } catch(e) { showToast('Error: ' + e.message, 'warn'); btn.disabled=false; btn.innerHTML='🚀 Join Exam'; }
}

socket.on('joined_ok', ({ started, duration }) => {
    totalSecs = (duration || 180) * 60;
    if (started) startExam();
});
socket.on('exam_started', ({ duration }) => {
    if (duration) totalSecs = duration * 60;
    startExam();
});
socket.on('student_joined', d => { document.getElementById('waitStudents').textContent = 'Students: ' + (d.count || 1); });

// ── START EXAM ────────────────────────────────────────────
function startExam() {
    document.getElementById('waitingPanel').style.display = 'none';
    document.getElementById('examPanel').style.display = 'block';
    document.getElementById('floatDoubtBtn').style.display = 'flex';
    document.getElementById('examSubject').textContent = paper.subject || 'Exam';
    document.getElementById('examClass').textContent = paper.className || '';
    document.getElementById('timerDisplay').style.display = 'block';
    renderNavMap();
    showQuestion(0);
    startTimer();
    setupAntiCheat();
    showToast('Exam started! Good luck 🍀', 'success');
}

// ── TIMER ─────────────────────────────────────────────────
function startTimer() {
    const disp = document.getElementById('timerDisplay');
    timer = setInterval(() => {
        if (totalSecs <= 0) { clearInterval(timer); autoSubmit(); return; }
        totalSecs--;
        const h = Math.floor(totalSecs/3600), m = Math.floor((totalSecs%3600)/60), s = totalSecs%60;
        disp.textContent = `${pad(h)}:${pad(m)}:${pad(s)}`;
        disp.className = 'timer-display' + (totalSecs<=300?' danger':totalSecs<=600?' warning':'');
        if (totalSecs===600) showToast('⚠️ 10 minutes remaining!', 'warn');
        if (totalSecs===300) showToast('🚨 5 minutes remaining!', 'warn');
        if (totalSecs===60) showToast('🔴 1 minute remaining!', 'warn');
    }, 1000);
}
function pad(n) { return String(n).padStart(2,'0'); }

// ── QUESTIONS ─────────────────────────────────────────────
function renderNavMap() {
    const nav = document.getElementById('qNav');
    nav.innerHTML = paper.questions.map((q,i) =>
        `<button class="q-nav-btn ${i===currentQ?'current':''} ${answers[q.questionNo]?'answered':''}" onclick="showQuestion(${i})">${i+1}</button>`
    ).join('');
}

function showQuestion(idx) {
    currentQ = idx;
    const q = paper.questions[idx];
    const isShort = q.type==='Short'||q.type==='Long'||q.type==='Descriptive';
    const savedAns = answers[q.questionNo] || '';

    document.getElementById('questionArea').innerHTML = `
        <div class="question-card">
            <div class="q-info">
                <span class="q-badge badge-ch">📖 ${q.chapter||'General'}</span>
                <span class="q-badge badge-type">${q.type||'MCQ'}</span>
                <span class="q-badge badge-marks">⭐ ${q.marks||1} mark${q.marks>1?'s':''}</span>
            </div>
            <div class="q-text">Q${q.questionNo||idx+1}. ${q.text}</div>
            ${isShort
                ? `<textarea class="short-answer" id="ansInput" placeholder="Write your answer here..." onchange="saveAnswer(${q.questionNo},this.value)">${savedAns}</textarea>`
                : `<div class="options-grid">${(q.options||[]).map((opt,oi)=>`<button class="option-btn ${savedAns===opt.charAt(0)?'selected':''}" onclick="selectOption(${q.questionNo},'${opt.charAt(0)}',this)">${opt}</button>`).join('')}</div>`
            }
            <div class="q-footer">
                <button class="btn-sm btn-outline" onclick="clearAnswer(${q.questionNo})">Clear Answer</button>
                <div class="nav-btns">
                    ${idx>0?`<button class="btn-sm btn-outline" onclick="showQuestion(${idx-1})">← Prev</button>`:''}
                    ${idx<paper.questions.length-1?`<button class="btn-sm btn-green" onclick="showQuestion(${idx+1})">Next →</button>`:''}
                </div>
            </div>
        </div>
    `;
    renderNavMap();
    updateProgress();
}

function selectOption(qNo, letter, btn) {
    answers[qNo] = letter;
    btn.closest('.options-grid').querySelectorAll('.option-btn').forEach(b=>b.classList.remove('selected'));
    btn.classList.add('selected');
    emitProgress();
    renderNavMap();
    updateProgress();
}

function saveAnswer(qNo, val) { answers[qNo] = val; emitProgress(); updateProgress(); renderNavMap(); }
function clearAnswer(qNo) { delete answers[qNo]; showQuestion(currentQ); }

function updateProgress() {
    const answered = Object.keys(answers).length;
    const pct = Math.round((answered/paper.questions.length)*100);
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressText').textContent = pct + '%';
}

function emitProgress() {
    socket.emit('student_progress', { roomCode, answered: Object.keys(answers).length, total: paper.questions.length });
}

// ── ANTI-CHEAT ────────────────────────────────────────────
function setupAntiCheat() {
    document.addEventListener('visibilitychange', () => {
        if(document.hidden) { socket.emit('anomaly', { roomCode, type: 'tab_switch' }); showToast('⚠️ Tab switch detected & reported!', 'warn'); }
    });
    let idleTimer;
    document.addEventListener('mousemove', () => { clearTimeout(idleTimer); idleTimer=setTimeout(()=>socket.emit('anomaly',{roomCode,type:'idle_30s'}),30000); });
}

// ── SUBMIT ────────────────────────────────────────────────
function confirmSubmit() {
    const answered = Object.keys(answers).length;
    const total = paper.questions.length;
    const unanswered = total - answered;
    if (!confirm(`You have answered ${answered}/${total} questions. ${unanswered > 0 ? unanswered + ' unanswered.' : ''}\n\nSubmit the paper now?`)) return;
    submitPaper();
}

function autoSubmit() { showToast('Time up! Auto-submitting...', 'warn'); setTimeout(submitPaper, 1500); }

async function submitPaper() {
    clearInterval(timer);
    const payload = {
        studentEmail, studentName,
        answers: Object.entries(answers).map(([qNo, answer]) => ({ questionNo: parseInt(qNo), answer }))
    };
    try {
        const resp = await fetch(`/api/exam-room/${roomCode}/submit`, {
            method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)
        }).then(r=>r.json());
        if (resp.success) {
            window.location.href = `student-syllabus-result.html?resultId=${resp.resultId}`;
        } else { showToast('Submission error: ' + resp.error, 'warn'); }
    } catch(e) { showToast('Submit failed: ' + e.message, 'warn'); }
}

// ── DOUBT CHAT ────────────────────────────────────────────
function toggleDoubt() {
    document.getElementById('doubtPanel').classList.toggle('open');
    document.getElementById('floatDoubtBtn').style.display = document.getElementById('doubtPanel').classList.contains('open') ? 'none' : 'flex';
}
function sendDoubt() {
    const msg = document.getElementById('doubtInput').value.trim();
    if (!msg) return;
    socket.emit('student_doubt', { roomCode, studentName, message: msg });
    addDoubtMsg(msg, 'sent');
    document.getElementById('doubtInput').value = '';
}
socket.on('teacher_reply', ({ message, time }) => { addDoubtMsg(`Teacher (${time}): ${message}`, 'received'); showToast('Teacher replied to doubt', 'info'); });
function addDoubtMsg(text, type) {
    const div = document.createElement('div');
    div.className = 'doubt-msg ' + type;
    div.textContent = text;
    const msgs = document.getElementById('doubtMessages');
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
}

// ── TOAST ─────────────────────────────────────────────────
function showToast(m, type='info') {
    const t = document.getElementById('toast');
    t.textContent = m; t.className = `toast ${type} show`;
    setTimeout(() => t.classList.remove('show'), 3500);
}
</script>
</body>
