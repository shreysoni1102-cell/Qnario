<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qnario – Result Preview</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* =========================
   GLOBAL
========================= */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Inter',sans-serif;
  background:#0f172a;
  color:white;
  min-height:100vh;
}

/* =========================
   BACKGROUND SYSTEM
========================= */
.bg-wrapper{
  position:fixed;
  inset:0;
  z-index:-2;
}

.gradient-mesh{
  position:absolute;
  inset:0;
  background:
    radial-gradient(at 20% 30%, #667eea 0px, transparent 50%),
    radial-gradient(at 80% 20%, #764ba2 0px, transparent 50%),
    radial-gradient(at 40% 80%, #4facfe 0px, transparent 50%),
    radial-gradient(at 90% 70%, #00f2fe 0px, transparent 50%);
  filter:blur(120px);
  opacity:0.7;
}

.grid-overlay{
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
  background-size:40px 40px;
  opacity:0.4;
}

/* =========================
   MAIN CONTAINER
========================= */
.container{
  max-width:1000px;
  margin:50px auto;
  padding:40px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(25px);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:24px;
  box-shadow:0 25px 70px rgba(0,0,0,0.4);
}

/* =========================
   HEADER
========================= */
.header{
  text-align:center;
  margin-bottom:35px;
}

.header h1{
  font-family:'Space Grotesk',sans-serif;
  font-size:28px;
  background:linear-gradient(135deg,#667eea,#4facfe);
  background-clip:text;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* =========================
   METADATA
========================= */
.metadata{
  margin-bottom:35px;
  font-size:14px;
  line-height:1.8;
  opacity:0.9;
}

.metadata p{
  margin-bottom:6px;
}

/* =========================
   QUESTIONS
========================= */
.question{
  margin-bottom:20px;
  padding:20px;
  border-radius:18px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  transition:0.3s;
}

.question.correct{
  border:1px solid rgba(40,167,69,0.6);
  background:rgba(40,167,69,0.1);
}

.question.incorrect{
  border:1px solid rgba(220,53,69,0.6);
  background:rgba(220,53,69,0.1);
}

.question h2{
  font-size:16px;
  margin-bottom:10px;
  font-weight:600;
}

.question p{
  font-size:14px;
  margin-bottom:6px;
  opacity:0.9;
}

/* =========================
   BUTTONS
========================= */
.buttons{
  margin-top:30px;
  display:flex;
  justify-content:space-between;
  gap:20px;
  flex-wrap:wrap;
}

button{
  flex:1;
  padding:14px;
  border-radius:16px;
  border:none;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  transition:0.3s;
  color:white;
}

.dashboard-btn{
  background:linear-gradient(135deg,#667eea,#4facfe);
}

.download-btn{
  background:linear-gradient(135deg,#00c853,#4caf50);
}

button:hover{
  transform:translateY(-3px);
  box-shadow:0 15px 35px rgba(0,0,0,0.4);
}

@media(max-width:768px){
  .buttons{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<!-- MASTER BACKGROUND -->
<div class="bg-wrapper">
  <div class="gradient-mesh"></div>
  <div class="grid-overlay"></div>
</div>

<div class="container">
  <div class="header">
    <h1>Result Preview</h1>
  </div>

  <div class="metadata" id="metadata"></div>
  <div class="questions" id="questions"></div>

  <div class="buttons">
    <button class="dashboard-btn" id="dashboard-btn">Back to Dashboard</button>
    <button class="download-btn" id="download-btn">Download Report (PDF)</button>
  </div>
</div>

<!-- =========================
     ORIGINAL BACKEND (UNCHANGED)
========================= -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
<script>
function getQueryParam(param) {
  const urlParams = new URLSearchParams(window.location.search);
  return urlParams.get(param);
}

const examId = getQueryParam("examId");
const results = JSON.parse(localStorage.getItem("qnario_results")) || [];
const result = results.find(r => r.examId === examId);

if (!result) {
  alert("Result not found.");
  window.location.href = "student-dashboard.html";
}

const metadataDiv = document.getElementById("metadata");
const attempted = Object.keys(result.answers).length;
const correct = result.score;

metadataDiv.innerHTML = `
  <p><strong>Exam Type:</strong> ${result.config.examType}</p>
  <p><strong>Difficulty:</strong> ${result.config.difficulty}</p>
  <p><strong>Number of Questions:</strong> ${result.config.numQuestions}</p>
  <p><strong>Attempted:</strong> ${attempted}</p>
  <p><strong>Correct:</strong> ${correct}</p>
  <p><strong>Score:</strong> ${result.score}/${result.config.numQuestions}</p>
`;

const questionsDiv = document.getElementById("questions");
result.questions.forEach((question, index) => {
  const isCorrect = question.type === "MCQ" && question.answer === result.answers[`question-${index}`];
  const questionDiv = document.createElement("div");
  questionDiv.classList.add("question", isCorrect ? "correct" : "incorrect");

  questionDiv.innerHTML = `
    <h2>${index + 1}. ${question.text}</h2>
    <p><strong>Your Answer:</strong> ${result.answers[`question-${index}`] || "Not Answered"}</p>
    ${question.type === "MCQ" ? `<p><strong>Correct Answer:</strong> ${question.answer}</p>` : ""}
  `;

  questionsDiv.appendChild(questionDiv);
});

document.getElementById("dashboard-btn").addEventListener("click", () => {
  window.location.href = "student-dashboard.html";
});

document.getElementById("download-btn").addEventListener("click", () => {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  doc.text("Result Preview", 10, 10);
  doc.text(`Exam Type: ${result.config.examType}`, 10, 20);
  doc.text(`Difficulty: ${result.config.difficulty}`, 10, 30);
  doc.text(`Number of Questions: ${result.config.numQuestions}`, 10, 40);
  doc.text(`Attempted: ${attempted}`, 10, 50);
  doc.text(`Correct: ${correct}`, 10, 60);
  doc.text(`Score: ${result.score}/${result.config.numQuestions}`, 10, 70);

  let y = 80;
  result.questions.forEach((question, index) => {
    doc.text(`${index + 1}. ${question.text}`, 10, y);
    y += 10;
    doc.text(`Your Answer: ${result.answers[`question-${index}`] || "Not Answered"}`, 10, y);
    y += 10;
    if (question.type === "MCQ") {
      doc.text(`Correct Answer: ${question.answer}`, 10, y);
      y += 10;
    }
    y += 5;
  });

  doc.save(`result_${examId}.pdf`);
});
</script>

</body>
</html>
