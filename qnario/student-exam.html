<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Qnario – Exam</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body {
            min-height: 100vh;
            background: #0f172a;
            color: #fff;
            overflow-x: hidden;
        }
        .bg-wrapper { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
        .gradient-mesh {
            position: absolute; width: 140%; height: 140%;
            background: radial-gradient(circle at 20% 30%, #667eea55, transparent 40%),
                        radial-gradient(circle at 80% 70%, #4facfe55, transparent 40%);
            filter: blur(120px);
        }
        .navbar {
            padding: 18px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 24px;
            font-weight: 700;
            text-decoration: none;
            background: linear-gradient(90deg, #667eea, #4facfe);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .wrap {
            max-width: 900px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }
        h1 { font-family: 'Space Grotesk', sans-serif; font-size: 2rem; margin-bottom: 10px; color: #4facfe; }
        .meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding: 15px; background: rgba(0,0,0,0.2); border-radius: 12px; }
        .timer { font-size: 1.5rem; font-weight: 700; color: #ff6b6b; font-family: 'Space Grotesk', sans-serif; }
        .question-card {
            margin-bottom: 20px;
            padding: 25px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: 0.3s;
        }
        .question-card.active { border-color: #4facfe; box-shadow: 0 0 20px rgba(79, 172, 254, 0.2); }
        .q-text { font-size: 1.1rem; font-weight: 500; margin-bottom: 20px; line-height: 1.6; }
        .options { display: grid; gap: 12px; }
        .option-label {
            display: flex;
            align-items: center;
            padding: 14px 20px;
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            transition: 0.2s;
        }
        .option-label:hover { background: rgba(255,255,255,0.1); }
        .option-label input { margin-right: 15px; transform: scale(1.2); }
        .option-label.selected { background: rgba(79, 172, 254, 0.2); border-color: #4facfe; }

        .btn {
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
            color: white;
            font-size: 1rem;
        }
        .btn-primary { background: linear-gradient(135deg, #667eea, #4facfe); }
        .btn-secondary { background: rgba(255,255,255,0.1); }
        .btn:hover { transform: translateY(-2px); opacity: 0.9; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .controls { display: flex; justify-content: space-between; margin-top: 40px; }
        .hidden { display: none; }

        #resultArea { margin-top: 30px; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .score-box { text-align: center; padding: 30px; border-radius: 20px; background: rgba(79, 172, 254, 0.1); border: 1px solid #4facfe; margin-bottom: 30px; }
        .score-circle { width: 120px; height: 120px; border-radius: 50%; border: 8px solid #4facfe; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 700; margin: 0 auto 20px; }
        
        .time-badge { font-size: 0.8rem; padding: 4px 8px; border-radius: 6px; background: rgba(255,255,255,0.1); margin-top: 10px; display: inline-block; }
    </style>
</head>
<body>
    <div class="bg-wrapper"><div class="gradient-mesh"></div></div>
    <div class="navbar">
        <a href="student-dashboard.html" class="logo">Qnario</a>
    </div>

    <div class="wrap">
        <div id="setupArea">
            <h1 id="examTitle">Exam Paper</h1>
            <div class="meta">
                <div id="metaDetails">Loading paper details...</div>
            </div>
            <button id="startBtn" class="btn btn-primary" style="width: 100%; font-size: 1.2rem; padding: 20px;">Start Examination</button>
        </div>

        <div id="examArea" class="hidden">
            <div class="meta" style="margin-bottom: 20px; padding: 15px; background: rgba(0,0,0,0.3);">
                <div style="font-weight: 600; color: #4facfe;">Time Remaining</div>
                <div class="timer" id="timer">--:--</div>
            </div>
            <div id="questionsContainer"></div>
            <div class="controls">
                <button id="prevBtn" class="btn btn-secondary">Previous</button>
                <span id="qProgress" style="align-self: center;">Question 1 of 10</span>
                <button id="nextBtn" class="btn btn-secondary">Next</button>
            </div>
            <button id="submitBtn" class="btn btn-primary" style="width: 100%; margin-top: 30px;">Finish & Submit</button>
        </div>

        <div id="resultArea" class="hidden"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const paperId = urlParams.get('paperId');
        const user = JSON.parse(localStorage.getItem('qnario_current_user') || 'null');
        
        if(!user) window.location.href = 'student-login.html';

        let paper = null;
        let currentQIdx = 0;
        let questions = [];
        let answers = []; // Stores user selections
        let timeSpent = []; // Stores time spent per question in seconds
        let startTime = 0;
        let timerInterval = null;
        let qStartTime = 0;

        function init() {
            const allPapers = JSON.parse(localStorage.getItem('qnario_student_papers') || '{}');
            const myPapers = allPapers[user.email] || [];
            paper = myPapers.find(p => p.id === paperId);

            if(!paper) {
                document.getElementById('setupArea').innerHTML = `<h2>Paper not found</h2><p>Please return to the dashboard.</p><a href="student-dashboard.html" class="btn btn-secondary" style="display:inline-block; margin-top:20px;">Return Home</a>`;
                return;
            }

            questions = paper.questions || [];
            // Support for old sectioned format
            if(questions.length === 0 && paper.sections) {
                for(const sec in paper.sections) {
                    questions = questions.concat(paper.sections[sec].questions);
                }
            }

            document.getElementById('examTitle').innerText = `${paper.meta.subject} - ${paper.meta.level}`;
            document.getElementById('metaDetails').innerText = `${paper.meta.chapter} • ${questions.length} Questions • ${paper.meta.timerMinutes}m limit`;

            // Initialize tracking
            answers = new Array(questions.length).fill(null);
            timeSpent = new Array(questions.length).fill(0);

            renderQuestions();
        }

        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';
            questions.forEach((q, idx) => {
                const qDiv = document.createElement('div');
                qDiv.className = `question-card ${idx === 0 ? '' : 'hidden'}`;
                qDiv.id = `q-card-${idx}`;

                let optionsHtml = '';
                if(q.options && q.options.length > 0) {
                    optionsHtml = `<div class="options">` + q.options.map((opt, i) => {
                        const optVal = typeof opt === 'string' ? opt : (opt.text || JSON.stringify(opt));
                        return `
                            <label class="option-label" id="label-${idx}-${i}">
                                <input type="radio" name="q-${idx}" value="${optVal}" onchange="selectOption(${idx}, ${i}, '${optVal.replace(/'/g, "\\'")}')">
                                <span>${optVal}</span>
                            </label>
                        `;
                    }).join('') + `</div>`;
                } else {
                    optionsHtml = `<input type="text" placeholder="Type your answer here..." style="width:100%; padding:15px; border-radius:12px; border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.05); color:white; outline:none;" onkeyup="typeAnswer(${idx}, this.value)">`;
                }

                qDiv.innerHTML = `
                    <div class="q-text"><strong>Q${idx+1}.</strong> ${q.text}</div>
                    ${optionsHtml}
                `;
                container.appendChild(qDiv);
            });
            updateProgress();
        }

        window.selectOption = function(qIdx, optIdx, val) {
            answers[qIdx] = val;
            const labels = document.querySelectorAll(`#q-card-${qIdx} .option-label`);
            labels.forEach((l, i) => {
                if(i === optIdx) l.classList.add('selected');
                else l.classList.remove('selected');
            });
        };

        window.typeAnswer = function(qIdx, val) {
            answers[qIdx] = val;
        };

        document.getElementById('startBtn').onclick = function() {
            document.getElementById('setupArea').classList.add('hidden');
            document.getElementById('examArea').classList.remove('hidden');
            startTimer(paper.meta.timerMinutes);
            qStartTime = Date.now();
        };

        function startTimer(minutes) {
            let totalSeconds = minutes * 60;
            document.getElementById('timer').innerText = `${String(minutes).padStart(2,'0')}:00`;
            timerInterval = setInterval(() => {
                totalSeconds--;
                if(totalSeconds <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('timer').innerText = `00:00`;
                    submitExam(true);
                    return;
                }
                const m = Math.floor(totalSeconds / 60);
                const s = totalSeconds % 60;
                document.getElementById('timer').innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            }, 1000);
        }

        function updateProgress() {
            document.getElementById('qProgress').innerText = `Question ${currentQIdx + 1} of ${questions.length}`;
            document.getElementById('prevBtn').disabled = currentQIdx === 0;
            document.getElementById('nextBtn').disabled = currentQIdx === questions.length - 1;
        }

        document.getElementById('nextBtn').onclick = function() {
            trackTimeSpent();
            document.getElementById(`q-card-${currentQIdx}`).classList.add('hidden');
            currentQIdx++;
            document.getElementById(`q-card-${currentQIdx}`).classList.remove('hidden');
            updateProgress();
            qStartTime = Date.now();
        };

        document.getElementById('prevBtn').onclick = function() {
            trackTimeSpent();
            document.getElementById(`q-card-${currentQIdx}`).classList.add('hidden');
            currentQIdx--;
            document.getElementById(`q-card-${currentQIdx}`).classList.remove('hidden');
            updateProgress();
            qStartTime = Date.now();
        };

        function trackTimeSpent() {
            const now = Date.now();
            const elapsed = Math.floor((now - qStartTime) / 1000);
            timeSpent[currentQIdx] += elapsed;
        }

        document.getElementById('submitBtn').onclick = function() {
            if(confirm('Are you sure you want to finish the exam?')) {
                trackTimeSpent();
                submitExam();
            }
        };

        function submitExam(auto = false) {
            clearInterval(timerInterval);
            if(auto) alert('Time is up! Your exam has been submitted automatically.');

            let correctCount = 0;
            const details = questions.map((q, i) => {
                const userAns = (answers[i] || '').toString().trim().toLowerCase();
                const actualAns = (q.correctAnswer || q.answer || '').toString().trim().toLowerCase();
                const isCorrect = userAns !== '' && (userAns === actualAns);
                if(isCorrect) correctCount++;
                return {
                    question: q.text,
                    userAnswer: answers[i],
                    correctAnswer: q.correctAnswer || q.answer,
                    isCorrect: isCorrect,
                    timeSeconds: timeSpent[i]
                };
            });

            const result = {
                paperId: paper.id,
                paperMeta: paper.meta,
                score: correctCount,
                total: questions.length,
                percentage: Math.round((correctCount / questions.length) * 100),
                details: details,
                takenAt: new Date().toISOString(),
                studentEmail: user.email
            };

            // Save to analytics
            const allResults = JSON.parse(localStorage.getItem('qnario_exam_results') || '[]');
            allResults.push(result);
            localStorage.setItem('qnario_exam_results', JSON.stringify(allResults));

            showResults(result);
        }

        function showResults(res) {
            document.getElementById('examArea').classList.add('hidden');
            const resultArea = document.getElementById('resultArea');
            resultArea.classList.remove('hidden');

            let detailsHtml = res.details.map((d, i) => `
                <div class="question-card" style="border-left: 5px solid ${d.isCorrect ? '#4ade80' : '#ff6b6b'}">
                    <div style="display:flex; justify-content:space-between;">
                        <strong>Question ${i+1}</strong>
                        <span style="color: ${d.isCorrect ? '#4ade80' : '#ff6b6b'}">${d.isCorrect ? 'Correct' : 'Incorrect'}</span>
                    </div>
                    <p style="margin: 10px 0;">${d.question}</p>
                    <div style="font-size: 0.9rem; opacity: 0.8; margin-top: 10px; padding: 10px; background: rgba(0,0,0,0.2); border-radius:8px;">
                        <strong>Your Answer:</strong> <span style="color:${d.isCorrect ? '#4ade80' : '#ff6b6b'}">${d.userAnswer || 'Not answered'}</span><br>
                        <strong>Correct Answer:</strong> <span style="color:#4ade80">${d.correctAnswer || 'Not provided'}</span>
                    </div>
                    <div class="time-badge">Time taken: ${d.timeSeconds}s</div>
                </div>
            `).join('');

            resultArea.innerHTML = `
                <div class="score-box">
                    <div class="score-circle">${res.percentage}%</div>
                    <h2 style="margin-bottom:10px;">${res.score} / ${res.total} Correct</h2>
                    <p>Exam submitted successfully. Check your detailed analysis below.</p>
                </div>
                <h3>Detailed Review</h3>
                <div style="margin-top:20px;">${detailsHtml}</div>
                <button onclick="window.location.href='student-dashboard.html'" class="btn btn-primary" style="width:100%; margin-top:30px;">Back to Dashboard</button>
            `;
        }

        init();
    </script>
</body>
</html>
