<!DOCTYPE html>
<html lang="en">
<head>
    <title>Qnario – Generated Papers</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:600,700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            background: linear-gradient(-45deg, #0f0c29, #1a1a3a, #24243e, #302b63);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
            padding: 40px 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 0 40px rgba(102,126,234,0.25);
        }

        h2 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 30px;
            background: linear-gradient(90deg, #667eea, #4facfe);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .filter-bar {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .filter-bar select {
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.08);
            color: white;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
        }

        .filter-bar select option {
            color: black;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
            border-radius: 14px;
            background: rgba(255,255,255,0.04);
        }

        th, td {
            padding: 14px 12px;
            text-align: left;
            font-size: 0.9rem;
        }

        th {
            background: rgba(255,255,255,0.08);
            font-weight: 700;
        }

        tr {
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        tr:last-child {
            border-bottom: none;
        }

        td.actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 14px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            background: linear-gradient(135deg, #667eea, #4facfe);
            color: white;
            transition: 0.3s ease;
            box-shadow: 0 0 15px rgba(79,172,254,0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(79,172,254,0.6);
        }

        /* Highlight date/time column */
        td:first-child {
            background: rgba(102, 126, 234, 0.1);
            font-weight: 600;
            color: #4facfe;
        }

        th:first-child {
            background: rgba(102, 126, 234, 0.2);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .empty-state a {
            color: #4facfe;
            font-weight: 600;
            text-decoration: none;
        }

        .empty-state a:hover {
            text-decoration: underline;
        }

        @media (max-width: 900px) {
            .container {
                padding: 20px;
            }

            table, thead, tbody, th, td, tr {
                display: block;
            }

            th {
                display: none;
            }

            tr {
                margin-bottom: 20px;
                padding: 14px;
                background: rgba(255,255,255,0.05);
                border-radius: 12px;
            }

            td {
                border: none;
                padding: 6px 0;
            }

            td.actions {
                margin-top: 10px;
            }
        }

        .sections-wrapper {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 40px;
        }

        .section-card {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 50px;
            min-width: 380px;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            transition: 0.3s ease;
            backdrop-filter: blur(10px);
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-decoration: none;
        }

        .section-card:hover {
            transform: translateY(-5px);
            background: rgba(255,255,255,0.12);
            box-shadow: 0 15px 40px rgba(102,126,234,0.4);
            border-color: rgba(79,172,254,0.6);
        }

        .section-card h3 {
            font-size: 1.8rem;
            margin-bottom: 15px;
            background: linear-gradient(90deg, #667eea, #4facfe);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .section-card p {
            font-size: 1rem;
            color: rgba(255,255,255,0.7);
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Papers & Questions</h2>

    <div class="filter-bar" style="justify-content: center; gap: 10px; margin-bottom: 30px;">
        <a href="teacher-dashboard.html" style="padding: 10px 20px; background: rgba(255,255,255,0.1); color: white; border-radius: 10px; text-decoration: none; font-weight: 600; display: inline-block;">⬅️ Back to Dashboard</a>
    </div>

    <div class="sections-wrapper">
        <a href="teacher-Exam-paper.html" class="section-card">
            <h3>Exam Paper Set's</h3>
            <p>View and manage all your exam paper sets.</p>
        </a>
        <a href="teacher-AI-Question's.html" class="section-card">
            <h3>AI generated paper</h3>
            <p>View AI generated questions and papers.</p>
        </a>
        <a href="teacher-syllabus-papers.html" class="section-card" style="background: rgba(16, 185, 129, 0.08); border-color: rgba(16, 185, 129, 0.3);">
            <h3 style="background: linear-gradient(90deg, #10b981, #34d399); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Syllabus Scans</h3>
            <p>View & download exams generated directly from uploaded syllabus documents.</p>
        </a>
    </div>
</div>

</body>
</html>
