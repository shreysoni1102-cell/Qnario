<!DOCTYPE html>
<html lang="en">
<head>
    <title>QNARIO – Sign Up</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Space+Grotesk:wght@600;800&display=swap" rel="stylesheet">

    <style>
        *{margin:0;padding:0;box-sizing:border-box}

        body{
            font-family:'Inter',sans-serif;
            color:white;
            overflow:hidden;
        }

        /* ================= VIDEO BACKGROUND ================= */

        .video-bg{
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            object-fit:cover;
            z-index:-3;
        }

        /* Dark overlay for readability */
        .video-overlay{
            position:fixed;
            inset:0;
            background:rgba(10,14,39,0.3);
            backdrop-filter:blur(4px);
            z-index:-2;
        }

        /* Subtle grid overlay */
        .grid-overlay{
            position:fixed;
            inset:0;
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size:40px 40px;
            z-index:-1;
        }

        /* ================= NAVBAR ================= */

        nav{
            position:fixed;
            width:100%;
            padding:20px 60px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            backdrop-filter:blur(20px);
            background:rgba(0,0,0,0.3);
            z-index:10;
        }

        .logo{
            font-family:'Space Grotesk',sans-serif;
            font-weight:800;
            font-size:1.5rem;
            background:linear-gradient(135deg,#667eea,#4facfe);
            background-clip:text;
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
            cursor:pointer;
        }

        /* ================= MAIN CARD ================= */

        .main-wrapper{
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:120px 20px;
            animation:fadeIn 1s ease forwards;
        }

        @keyframes fadeIn{
            from{opacity:0; transform:translateY(20px);}
            to{opacity:1; transform:translateY(0);}
        }

        .card{
            width:100%;
            max-width:420px;
            background:rgba(255,255,255,0.95);
            backdrop-filter:blur(20px);
            border:1px solid rgba(255,255,255,0.1);
            padding:40px;
            border-radius:20px;
            box-shadow:0 20px 50px rgba(0,0,0,0.6), 0 0 40px rgba(102,126,234,0.3);
        }

        .card h2{
            font-family:'Space Grotesk',sans-serif;
            text-align:center;
            margin-bottom:30px;
            font-size:2rem;
            background:linear-gradient(135deg,#667eea,#764ba2);
            background-clip:text;
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
            text-shadow:0 0 20px rgba(102,126,234,0.5);
            filter:drop-shadow(0 0 10px rgba(102,126,234,0.4));
        }

        input, select{
            width:100%;
            padding:14px;
            margin-bottom:18px;
            border-radius:10px;
            border:2px solid rgba(102,126,234,0.5);
            background:linear-gradient(135deg,rgba(102,126,234,0.1),rgba(118,75,162,0.1));
            color:#333;
            font-size:1rem;
            outline:none;
        }

        input::placeholder{
            color:rgba(102,126,234,0.7);
        }

        select{
            color:#333;
        }

        .signup-btn{
            width:100%;
            padding:14px;
            border:none;
            border-radius:12px;
            font-size:1.1rem;
            font-weight:600;
            cursor:pointer;
            background:linear-gradient(135deg,#667eea,#764ba2);
            color:white;
            transition:0.3s;
        }

        .signup-btn:hover{
            transform:translateY(-3px);
            box-shadow:0 10px 30px rgba(102,126,234,0.6);
        }

        .error{
            color:#ff6b6b;
            text-align:center;
            margin-top:10px;
        }

        .success{
            color:#38d39f;
            text-align:center;
            margin-top:10px;
        }

    </style>
</head>

<body>

<!-- Background Video -->
<video autoplay muted loop playsinline class="video-bg">
    <source src="student.mp4" type="video/mp4">
</video>

<div class="video-overlay"></div>
<div class="grid-overlay"></div>

<nav>
    <div class="logo" onclick="goHome()">QNARIO</div>
</nav>

<div class="main-wrapper">
    <div class="card">
        <h2>Create Account</h2>

        <form id="signupForm" autocomplete="off">
            <input type="text" id="name" placeholder="Full Name" required>
            <input type="email" id="email" placeholder="Email address" required>
            <input type="password" id="password" placeholder="Password" required>
            <input type="text" id="mobile" placeholder="Mobile number (10 digits)" required>

            <select id="role" required>
                <option value="">Select Role</option>
                <option value="student">Student</option>
                <option value="teacher">Teacher</option>
            </select>

            <button type="submit" class="signup-btn">Sign Up</button>

            <div id="errorMsg" class="error"></div>
            <div id="successMsg" class="success"></div>
        </form>
    </div>
</div>

<script>
function goHome(){
    window.location.href="landing.html";
}

document.getElementById('signupForm').onsubmit = async function(e) {
    e.preventDefault();

    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();
    const mobile = document.getElementById('mobile').value.trim();
    const role = document.getElementById('role').value;

    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');

    errorMsg.innerText = '';
    successMsg.innerText = '';

    const res = await fetch('/api/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password, mobile, role })
    });

    const data = await res.json();

    if (data.success) {
        successMsg.innerText = 'Registration successful! You can now log in.';
        document.getElementById('signupForm').reset();
    } else {
        errorMsg.innerText = data.error || 'Registration failed. Please check your details.';
    }
};
</script>

</body>
</html>
