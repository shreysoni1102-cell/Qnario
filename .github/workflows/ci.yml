name: Qnario CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          cd server
          npm install
      - name: Run tests
        run: |
          cd server
          npm test
        env:
          JWT_SECRET: test_secret_key_for_ci_only
          MONGODB_URI: mongodb://localhost:27017/qnario_test
          NODE_ENV: test

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          cd ai-service
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Run tests
        run: |
          cd ai-service
          python -m pytest
        env:
          GROQ_API_KEY: dummy_key_for_ci
          GEMINI_API_KEY: dummy_key_for_ci

  ai-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check path changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            gemini_service:
              - 'ai-service/services/gemini_service.py'
              - 'ai-service/evals/**'
      
      - name: Set up Python
        if: steps.filter.outputs.gemini_service == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        if: steps.filter.outputs.gemini_service == 'true'
        run: |
          cd ai-service
          pip install -r requirements.txt
          pip install requests

      - name: Run evals
        if: steps.filter.outputs.gemini_service == 'true'
        run: |
          python ai-service/evals/eval_runner.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'dummy_key_for_ci' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'dummy_key_for_ci' }}

      - name: Post Job Summary
        if: steps.filter.outputs.gemini_service == 'true' && always()
        run: |
          if [ -f ai-service/evals/eval_report.md ]; then
            cat ai-service/evals/eval_report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Eval Report
        if: steps.filter.outputs.gemini_service == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-eval-report
          path: |
            ai-service/evals/eval_report.json
            ai-service/evals/eval_report.md
