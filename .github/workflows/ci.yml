name: Qnario CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: cd qnario && npm install
      - name: Run tests
        run: cd qnario && npm test
        env:
          JWT_SECRET: test_secret_key_for_ci_only
          MONGODB_URI: mongodb://localhost:27017/qnario_test
          NODE_ENV: test

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: cd gemini-microservice && pip install -r requirements.txt && pip install pytest
      - name: Run tests
        run: cd gemini-microservice && python -m pytest tests/
        env:
          GROQ_API_KEY: dummy_key_for_ci
          GOOGLE_GENAI_API_KEY: dummy_key_for_ci
