version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: qnario_mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  ai-service:
    build: ./ai-service
    container_name: qnario_ai
    restart: unless-stopped
    ports:
      - '5000:5000'
    env_file: ./ai-service/.env
    depends_on:
      - mongodb

  server:
    build: ./server
    container_name: qnario_server
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file: ./server/.env
    depends_on:
      - mongodb
      - ai-service

  client:
    build: ./client
    container_name: qnario_client
    restart: unless-stopped
    ports:
      - '5173:5173'
    env_file: ./client/.env
    depends_on:
      - server

volumes:
  mongo_data:
